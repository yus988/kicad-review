<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基板 レビュー</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟩</text></svg>">
<link rel="stylesheet" href="/review.css">
<style>
header .name { font-weight: 700; max-width: 22em; overflow: hidden; text-overflow: ellipsis; }
header .file { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
#bstat { width: 7.5em; color: var(--muted); flex: 0 0 auto; }
#bstat.err { color: var(--sev-必須); font-weight: 600; cursor: help; }

/* board picker */
#picker .prow { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
#picker input, #picker select { font: inherit; flex: 1; min-width: 0; padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; }
#picker .k { width: 5.5em; color: var(--muted); flex: 0 0 auto; }
#picker .btns { display: flex; gap: 6px; align-items: center; }
#picker .btns .grow { flex: 1; }
#pickMsg { color: var(--muted); width: 8em; }

/* board */
#tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
#presets { display: flex; gap: 4px; }
#presets button { width: 4em; padding: 3px 0; }
#layerBoxes { display: flex; flex-wrap: wrap; gap: 2px 10px; }
#layerBoxes label, #tools .opt { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; font-size: 12px; }
#coord { color: var(--muted); font-size: 12px; width: 11em; font-variant-numeric: tabular-nums; }
#view { position: relative; overflow: hidden; background: #000; cursor: grab; touch-action: none; }
#view.drag { cursor: grabbing; }
#layers { position: absolute; inset: 0; z-index: 0; }
#layers img { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; user-select: none; }
#ov { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
#ov text { font: 700 13px system-ui, sans-serif; paint-order: stroke; stroke: #000; stroke-width: 3px; stroke-linejoin: round; }
#ov .pl text { font-family: system-ui, sans-serif; font-weight: 600; fill: #fff; stroke: rgba(0,0,0,.55); stroke-width: 1.5px;
  text-anchor: middle; dominant-baseline: central; }
#pop { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.35); min-width: 220px; cursor: default; }
#pop[hidden] { display: none; }
#pop .what { font-weight: 600; }
#pop .xy { color: var(--muted); font-size: 11px; }
#pop .ask { display: flex; gap: 4px; margin-top: 5px; }
#pop input { font: inherit; flex: 1; min-width: 16em; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; }
#noBoard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 15px; }
#noBoard[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <div id="tabs"></div>
  <span class="name" id="bname">基板 レビュー</span>
  <span class="file" id="bfile"></span>
  <span id="bstat"></span>
  <button id="pickBtn" title="レビューする基板（.kicad_pcb）を選ぶ">基板を選ぶ</button>
  <span id="presence"></span>
  <button id="pageNew" class="off" title="このページの新しい版があります。押すと読み込み直す（入力中のコメントは残る）">画面を更新</button>
  <button id="reload" title="基板ファイルを読み直す（保存すると自動でも読み直す）">再読み込み</button>
</header>
<div id="picker" class="panel" hidden>
  <div class="prow"><span class="k">パス</span><input id="pickPath" placeholder=".kicad_pcb のパス" spellcheck="false"></div>
  <div class="prow"><span class="k">プロジェクト</span><select id="pickProj" title="親フォルダとその下 2 階層の KiCad プロジェクト（基板のあるもの）"></select></div>
  <div class="btns"><button id="pickHint" hidden></button><span class="grow"></span><span id="pickMsg"></span><button id="pickClose">閉じる</button><button id="pickOpen" class="on">開く</button></div>
</div>
<div id="lb" hidden></div>
<div id="work">
<div id="upper">
<div id="dockL" class="dock"></div><div class="dsplit" data-dock="L"></div>
<main id="center">
  <div id="tools">
    <div id="presets"><button data-p="F">表</button><button data-p="B">裏</button><button data-p="In">内層</button><button data-p="all">全部</button></div>
    <div id="layerBoxes"></div>
    <label class="opt" title="表示している面のパッドに、ピンの番号とネットの名前を出す（拡大すると出る）"><input type="checkbox" id="padText">ピン・ネット</label>
    <label class="opt" title="銅箔のベタ（ゾーンの塗り）を、その層の下に薄く表示"><input type="checkbox" id="fillBox">ベタ</label>
    <label class="opt" title="表示している面の部品の外形（コートヤード）をシルクの上に表示"><input type="checkbox" id="courtBox">外形</label>
    <button id="fit" title="基板全体を表示。もう一度押すと元の拡大に戻る">全体</button>
    <span id="coord"></span>
  </div>
  <div id="view">
    <div id="layers"></div>
    <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="pop" hidden></div>
    <div id="noBoard" hidden>基板が開かれていません（「基板を選ぶ」から開く）</div>
  </div>
</main>
<div class="dsplit" data-dock="R"></div><div id="dockR" class="dock"></div>
</div>
<div class="dsplit" data-dock="B"></div><div id="dockB" class="dock"></div>
<section class="panelbox" data-panel="list"><div class="ptitle"><span class="grip">⠿</span>一覧</div>
  <div class="list-h"><span id="progress"></span><span class="grow"></span><button id="showUnread">未読も表示</button><button id="showDone">完了も表示</button></div>
  <div id="list"></div>
</section>
<section class="panelbox" data-panel="detail"><div class="ptitle"><span class="grip">⠿</span>詳細</div>
  <div id="detail"><div id="detBody"><div class="empty">項目を選ぶと、ここに内容が出ます。基板の上を押すと、その場所について質問できます。</div></div>
    <div id="post" hidden>
      <div class="review-btns" id="stBtns"></div>
      <div class="post-row"><textarea id="comment" rows="1" placeholder="コメント（エージェントに届く。Ctrl+Enter で送信）"></textarea><button id="send">送信</button></div>
    </div>
  </div>
</section>
</div>
<script src="/review.js"></script>
<script>
'use strict';
// ------------------------------------------------------------ constants and helpers
const POLL_MS = 3000;
const { $, esc, store, api, notice, DONE, SEVERITIES, ST_MARK, ST_NAME } = Review;
// drawing colours on the black board
const ST_COLOR = { '': '#ffd400', '自分で修正': '#ff8c00', '修正を依頼': '#ff8c00', '質問': '#ff3cff', 'このまま': '#9aa0a6', '修正済み': '#2ecc40' };
const HL_COLOR = '#ff00aa';    // a part shown from a link (#ref=)
const FILL_OPACITY = 0.35;     // zone fills under their copper layer, times that layer's opacity
const FOCUS_MM = 20;          // selecting an item shows about this much board around it
const PIN_FOCUS_MM = 9;       // ... or around its pins, when it names them
const MAX_SCALE = 150;        // px per mm
const sideName = s => s === 'F' ? '表' : s === 'B' ? '裏' : s;
const cuLayer = s => s === 'F' ? 'F.Cu' : s === 'B' ? 'B.Cu' : s + '.Cu';
const idKey = id => { const m = /^(.*?)(\d+)$/.exec(id); return m ? [m[1], +m[2]] : [id, 0]; };
const byId = (a, b) => { const x = idKey(a), y = idKey(b); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1]; };
const stOf = it => (it && it.status) || '';

// ------------------------------------------------------------ state
const S = {
  board: null,                 // GET /api/board (null: no board open)
  items: {},                   // the talk items of the board review
  sel: null,
  hl: null,                    // {ref, bbox}: a part shown from #ref=, until the next click on the board or a selection
  padText: store.get('kireview.padText') !== '0',
  fills: store.get('kireview.fills') !== '0',
  court: store.get('kireview.court') === '1',
  view: { s: 0, tx: 0, ty: 0 },   // screen px = board mm * s + t
  layers: null,                // {preset, active: 'F' | 'B' | 'In1' ..., vis: [layer names]}
};
let conn = null;               // talk long poll of the review
const page = () => S.board && S.board.review.page;
const filt = Review.filters('kireview.board', () => renderList());

// ------------------------------------------------------------ board view: layers, transform, presets
const view = $('view');
const imgs = {};               // layer name -> <img>
const fillImgs = {};           // copper layer name -> <img> with its zone fills

function copperKeys() { return S.board.copper.map(n => n === 'F.Cu' ? 'F' : n === 'B.Cu' ? 'B' : n.replace('.Cu', '')); }
function innerKeys() { return copperKeys().filter(k => k !== 'F' && k !== 'B'); }

// presets F / B / 内層 leave the courtyards out (外形 or the layer boxes turn them on); 全部 has every layer
function presetLayers(p) {
  const inner = S.board.copper.filter(n => n !== 'F.Cu' && n !== 'B.Cu');
  if (p === 'F') return ['F.Cu', 'F.Silkscreen', 'Edge.Cuts'];
  if (p === 'B') return ['B.Cu', 'B.Silkscreen', 'Edge.Cuts'];
  if (p === 'In') return [...inner, 'F.Silkscreen', 'Edge.Cuts'];
  return S.board.layers.map(l => l.name);
}

function setPreset(p, active) {
  if (!active) active = p === 'F' || p === 'B' ? p : p === 'In' ? (innerKeys().includes(S.layers.active) ? S.layers.active : innerKeys()[0] || 'F') : S.layers.active;
  S.layers = { preset: p, active, vis: presetLayers(p) };
  saveLayers();
  applyLayers();
}

function saveLayers() { store.set('kireview.layers', JSON.stringify(S.layers)); }

// stacking, bottom first: the far side, then the near side's copper and silkscreen, the courtyards, the outline on top
function layerOrder() {
  const a = S.layers.active, cu = S.board.copper.slice();
  const act = cuLayer(a);
  let order;
  if (a === 'B') order = ['F.Silkscreen', ...cu.filter(n => n !== 'B.Cu'), 'B.Cu', 'B.Silkscreen', 'F.Courtyard', 'B.Courtyard'];
  else if (a === 'F') order = ['B.Silkscreen', ...cu.slice().reverse().filter(n => n !== 'F.Cu'), 'F.Cu', 'F.Silkscreen', 'B.Courtyard', 'F.Courtyard'];
  else order = ['B.Silkscreen', 'B.Cu', 'F.Cu', ...cu.filter(n => n !== act && n !== 'F.Cu' && n !== 'B.Cu'), act, 'F.Silkscreen', 'B.Courtyard', 'F.Courtyard'];
  return [...order, 'Edge.Cuts'];
}

// 外形: the courtyard of the side(s) on show (F for F and the inner layers, B for B, both for 全部)
function courtyards() {
  if (!S.court) return [];
  if (S.layers.preset === 'all') return ['F.Courtyard', 'B.Courtyard'];
  return [S.layers.active === 'B' ? 'B.Courtyard' : 'F.Courtyard'];
}

// an item on several copper layers: those layers only, all see-through so each shows through the others
function setMulti(keys, active) {
  S.layers = { preset: 'multi', active, vis: [...keys.map(cuLayer), active === 'B' ? 'B.Silkscreen' : 'F.Silkscreen', 'Edge.Cuts'] };
  saveLayers();
  applyLayers();
}

function applyLayers() {
  const order = layerOrder(), vis = new Set(S.layers.vis), a = S.layers.active;
  const shown = new Set([...vis, ...courtyards()]);
  const inner = !(a === 'F' || a === 'B'), multi = S.layers.preset === 'multi';
  for (const [name, img] of Object.entries(imgs)) {
    const z = order.indexOf(name) + 1;
    img.style.zIndex = 2 * z;                                   // a fill goes at 2z - 1, directly under its layer
    img.style.display = shown.has(name) ? '' : 'none';
    let op = 1;
    if (inner && name === 'F.Silkscreen') op = 0.35;           // orientation only
    else if (multi && name.endsWith('.Cu')) op = 0.55;          // the active one too
    else if (name.endsWith('.Cu') && name !== cuLayer(a)) op = 0.6;  // copper of the other sides, under the active one
    img.style.opacity = op;
    const f = fillImgs[name];
    if (f) {
      f.style.zIndex = 2 * z - 1;
      f.style.display = S.fills && shown.has(name) ? '' : 'none';
      f.style.opacity = FILL_OPACITY * op;
    }
  }
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.p === S.layers.preset));
  document.querySelectorAll('#layerBoxes input').forEach(c => { c.checked = vis.has(c.value); });
  drawOverlay();
}

function buildLayerBoxes() {
  const box = $('layerBoxes');
  box.innerHTML = S.board.layers.map(l => '<label><input type="checkbox" value="' + esc(l.name) + '">' + esc(l.name) + '</label>').join('');
  box.querySelectorAll('input').forEach(c => c.addEventListener('change', () => {
    const vis = new Set(S.layers.vis);
    c.checked ? vis.add(c.value) : vis.delete(c.value);
    S.layers.vis = [...vis];
    if (S.layers.preset !== 'multi') S.layers.preset = 'custom';
    const k = c.value.endsWith('.Cu') ? copperKeys()[S.board.copper.indexOf(c.value)] : null;
    if (c.checked && k) S.layers.active = k;        // a copper layer just turned on comes to the top
    saveLayers();
    applyLayers();
  }));
}

// swap the layer pictures only when every new one has loaded, so a reload does not flash
function loadLayerImages() {
  const holder = $('layers'), want = [];
  for (const l of S.board.layers) {
    want.push([l.name, l.url, false]);
    if (l.fill) want.push([l.name, l.fill, true]);
  }
  const fresh = want.map(([name, url, fill]) => new Promise(res => {
    const im = new Image();
    im.alt = name + (fill ? ' ベタ' : '');
    im.onload = im.onerror = () => res([name, im, fill]);
    im.src = url;
  }));
  return Promise.all(fresh).then(list => {
    holder.innerHTML = '';
    for (const k of Object.keys(imgs)) delete imgs[k];
    for (const k of Object.keys(fillImgs)) delete fillImgs[k];
    for (const [name, im, fill] of list) { (fill ? fillImgs : imgs)[name] = im; holder.appendChild(im); }
    placeImages();
    applyLayers();
  });
}

function placeImages() {
  if (!S.board) return;
  const c = S.board.crop, v = S.view;
  for (const im of [...Object.values(imgs), ...Object.values(fillImgs)]) {
    im.style.left = (c[0] * v.s + v.tx) + 'px';
    im.style.top = (c[1] * v.s + v.ty) + 'px';
    im.style.width = ((c[2] - c[0]) * v.s) + 'px';
    im.style.height = ((c[3] - c[1]) * v.s) + 'px';
  }
}

function redraw() { placeImages(); drawOverlay(); }

function fitBoard() {
  const b = S.board.bbox || S.board.crop, W = view.clientWidth, H = view.clientHeight;
  if (!W || !H) { S.view = { s: 0, tx: 0, ty: 0 }; return; }
  const s = Math.min(W / (b[2] - b[0]), H / (b[3] - b[1])) * 0.92;
  S.view = { s, tx: W / 2 - (b[0] + b[2]) / 2 * s, ty: H / 2 - (b[1] + b[3]) / 2 * s };
  redraw();
}

// 全体 toggles: the first press shows the whole board and keeps the view it left, the second press goes back to that view
let viewBeforeWhole = null;
function toggleWhole() {
  if (!S.board) return;
  if (viewBeforeWhole) { S.view = viewBeforeWhole; viewBeforeWhole = null; redraw(); }
  else { viewBeforeWhole = Object.assign({}, S.view); fitBoard(); }
  $('fit').classList.toggle('on', !!viewBeforeWhole);
}
function clearWhole() { viewBeforeWhole = null; $('fit').classList.remove('on'); }

function focusOn(x, y, mm) {
  const W = view.clientWidth, H = view.clientHeight;
  const s = Math.min(MAX_SCALE, Math.min(W, H) / mm);
  S.view = { s, tx: W / 2 - x * s, ty: H / 2 - y * s };
  redraw();
}

const toMM = (px, py) => [(px - S.view.tx) / S.view.s, (py - S.view.ty) / S.view.s];

function initPanZoom() {
  let drag = null;
  view.addEventListener('wheel', e => {
    if (!S.board) return;
    e.preventDefault();
    const r = view.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const [x, y] = toMM(px, py);
    const b = S.board.crop, fit = Math.min(view.clientWidth / (b[2] - b[0]), view.clientHeight / (b[3] - b[1]));
    const s = Math.max(fit * 0.4, Math.min(MAX_SCALE, S.view.s * Math.pow(1.0015, -e.deltaY)));
    S.view = { s, tx: px - x * s, ty: py - y * s };
    redraw();
  }, { passive: false });
  view.addEventListener('pointerdown', e => {
    if (!S.board || e.button !== 0 || e.target.closest('#pop')) return;
    drag = { x: e.clientX, y: e.clientY, tx: S.view.tx, ty: S.view.ty, moved: false };
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', e => {
    if (!S.board) return;
    const r = view.getBoundingClientRect(), [x, y] = toMM(e.clientX - r.left, e.clientY - r.top);
    $('coord').textContent = 'x ' + x.toFixed(2) + '  y ' + y.toFixed(2) + ' mm';
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    view.classList.add('drag');
    S.view.tx = drag.tx + dx;
    S.view.ty = drag.ty + dy;
    redraw();
  });
  view.addEventListener('pointerup', e => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    view.classList.remove('drag');
    if (!moved) boardClick(e);
  });
}

// ------------------------------------------------------------ overlay: item markers in screen px
function markerGeom(it) {
  const v = S.view, cx = it.x * v.s + v.tx, cy = it.y * v.s + v.ty;
  if (it.w != null && it.h != null) return { box: true, cx, cy, hw: Math.max(6, it.w * v.s / 2), hh: Math.max(6, it.h * v.s / 2) };
  return { box: false, cx, cy, r: Math.max(9, (it.r || 1) * v.s) };
}

// pad number and net name on the pads of the active copper layer, like the KiCad editor; only where a pad is big enough on screen
function shortNet(n) {
  if (!n || n.startsWith('unconnected-')) return '';
  if (n.startsWith('/')) n = n.slice(n.lastIndexOf('/') + 1);    // hierarchical path: the last name, as KiCad shows it
  return n.replace(/\{slash\}/g, '/');
}
function padLabels(vis) {
  const lay = cuLayer(S.layers.active), d = S.board.dump;
  if (!S.padText || !d || !vis.has(lay)) return '';
  const v = S.view, W = view.clientWidth, H = view.clientHeight, out = [];
  const fit = (t, L, maxH) => Math.min(maxH, L * 0.9 / Math.max(1, t.length * 0.62));
  for (const p of d.pads) {
    if (!p.layers.includes(lay)) continue;
    let x0 = p.x - p.size[0] / 2, x1 = p.x + p.size[0] / 2, y0 = p.y - p.size[1] / 2, y1 = p.y + p.size[1] / 2;
    if (p.poly && p.poly.length) {
      const xs = p.poly.map(q => q[0]), ys = p.poly.map(q => q[1]);
      x0 = Math.min(...xs); x1 = Math.max(...xs); y0 = Math.min(...ys); y1 = Math.max(...ys);
    }
    const pw = (x1 - x0) * v.s, ph = (y1 - y0) * v.s;
    const cx = (x0 + x1) / 2 * v.s + v.tx, cy = (y0 + y1) / 2 * v.s + v.ty;
    if (cx + pw < 0 || cx - pw > W || cy + ph < 0 || cy - ph > H) continue;
    const vert = ph > pw * 1.15, L = vert ? ph : pw, sh = vert ? pw : ph;
    const num = p.num || '', net = shortNet(p.net);
    if (sh < 8 || (!num && !net)) continue;
    const g = vert ? '<g class="pl" transform="rotate(-90 ' + cx + ' ' + cy + ')">' : '<g class="pl">';
    const txt = (t, y, f) => '<text x="' + cx + '" y="' + y + '" style="font-size:' + f.toFixed(1) + 'px">' + esc(t) + '</text>';
    const f2 = net ? fit(net, L, sh * 0.3) : 0;
    if (net && sh >= 16 && f2 >= 4.5) {
      const f1 = num ? fit(num, L, sh * 0.42) : 0;
      out.push(g + (num ? txt(num, cy - sh * 0.2, f1) : '') + txt(net, cy + (num ? sh * 0.2 : 0), f2) + '</g>');
    } else if (num) {
      const f1 = fit(num, L, sh * 0.6);
      if (f1 >= 5) out.push(g + txt(num, cy, f1) + '</g>');
    }
  }
  return out.join('');
}

const BIG_AREA = 0.1;                    // share of the board above which a fixed item is drawn without the tint
function itemArea(it) { return it.w != null && it.h != null ? it.w * it.h : Math.PI * (it.r || 1) ** 2; }
function boardArea() { const b = S.board.bbox || S.board.crop; return (b[2] - b[0]) * (b[3] - b[1]); }
const placed = it => typeof it.x === 'number' && typeof it.y === 'number';

function drawOverlay() {
  const ov = $('ov');
  if (!S.board) { ov.innerHTML = ''; return; }
  const vis = new Set(S.layers.vis);
  const parts = [padLabels(vis)];
  const ids = Object.keys(S.items).filter(id => placed(S.items[id])).sort((a, b) => (a === S.sel) - (b === S.sel) || byId(a, b));
  for (const id of ids) {
    const it = S.items[id], g = markerGeom(it);
    const col = ST_COLOR[stOf(it)] || ST_COLOR[''];
    const sel = id === S.sel, fixed = stOf(it) === '修正済み', done = DONE.has(stOf(it));
    const onShown = (it.sides || []).some(s => vis.has(cuLayer(s)));
    const w = sel ? 4 : done && !fixed ? 1.2 : 2.2;
    const op = S.sel && !sel ? 0.4 : 1;
    const dash = onShown ? '' : ' stroke-dasharray="5 4"';
    // tint a fixed item, but not one that covers a large part of the board (a whole-board item would cover everything)
    const fill = fixed && itemArea(it) < BIG_AREA * boardArea() ? ' fill="' + col + '" fill-opacity="0.22"' : ' fill="none"';
    let shape, lx, ly;
    if (g.box) {
      const r = 'x="' + (g.cx - g.hw) + '" y="' + (g.cy - g.hh) + '" width="' + 2 * g.hw + '" height="' + 2 * g.hh + '"';
      shape = '<rect ' + r + ' fill="none" stroke="#000" stroke-width="' + (w + 3) + '"/><rect ' + r + fill + ' stroke="' + col + '" stroke-width="' + w + '"' + dash + '/>';
      lx = g.cx + g.hw + 3; ly = g.cy - g.hh - 3;
    } else {
      const c = 'cx="' + g.cx + '" cy="' + g.cy + '" r="' + g.r + '"';
      shape = '<circle ' + c + ' fill="none" stroke="#000" stroke-width="' + (w + 3) + '"/><circle ' + c + fill + ' stroke="' + col + '" stroke-width="' + w + '"' + dash + '/>';
      lx = g.cx + g.r * 0.72 + 2; ly = g.cy - g.r * 0.72 - 2;
    }
    parts.push('<g opacity="' + op + '">' + shape + '<text x="' + lx + '" y="' + ly + '" fill="' + col + '"' +
      (sel ? ' style="font-size:15px"' : '') + '>' + esc(id) + (fixed ? ' ✔' : '') + '</text></g>');
  }
  if (S.sel && S.items[S.sel] && placed(S.items[S.sel])) {
    const it = S.items[S.sel], col = ST_COLOR[stOf(it)] || ST_COLOR[''];
    parts.push(pinArrows(it, col), spotArrows(it, col));
  }
  if (S.hl) parts.push(highlight());
  ov.innerHTML = parts.join('');
}

// a part shown from #ref=: a dashed frame in the selection colour, labelled with its reference
function highlight() {
  const v = S.view, b = S.hl.bbox;
  const x = b[0] * v.s + v.tx - 4, y = b[1] * v.s + v.ty - 4, w = (b[2] - b[0]) * v.s + 8, h = (b[3] - b[1]) * v.s + 8;
  const r = 'x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"';
  return '<rect ' + r + ' fill="none" stroke="#000" stroke-width="6"/><rect ' + r + ' fill="none" stroke="' + HL_COLOR +
    '" stroke-width="3" stroke-dasharray="8 5"/><text x="' + x + '" y="' + (y - 5) + '" fill="' + HL_COLOR + '" style="font-size:15px">' + esc(S.hl.ref) + '</text>';
}

// the pads an item points at: its pins (["U3.2", ...]), else the refs written as REF.NUM
function itemPads(it) {
  const d = S.board && S.board.dump;
  if (!d) return [];
  const specs = it.pins && it.pins.length ? it.pins : (it.refs || []).filter(r => /\.[^.]+$/.test(r));
  const out = [];
  for (const sp of specs) {
    const k = sp.lastIndexOf('.'), ref = sp.slice(0, k), num = sp.slice(k + 1);
    for (const p of d.pads) if (p.ref === ref && p.num === num) out.push([sp, p]);
  }
  return out;
}
function padPoly(p) {
  if (p.poly && p.poly.length) return p.poly;
  const w = p.size[0] / 2, h = p.size[1] / 2;
  return [[p.x - w, p.y - h], [p.x + w, p.y - h], [p.x + w, p.y + h], [p.x - w, p.y + h]];
}
// selected item: outline each pin and point an arrow at it, coming from outside the footprint (away from its centre)
function pinArrows(it, col) {
  const v = S.view, d = S.board.dump, out = [];
  const fpAt = {};
  for (const f of d.footprints) fpAt[f.ref] = f;
  for (const [sp, p] of itemPads(it)) {
    const poly = padPoly(p);
    const pts = poly.map(q => (q[0] * v.s + v.tx).toFixed(1) + ',' + (q[1] * v.s + v.ty).toFixed(1)).join(' ');
    out.push('<polygon points="' + pts + '" fill="none" stroke="#000" stroke-width="5"/>' +
      '<polygon points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>');
    const f = fpAt[p.ref];
    let ux = f ? p.x - f.x : 0, uy = f ? p.y - f.y : 0;
    const n = Math.hypot(ux, uy);
    if (n < 1e-3) { ux = -Math.SQRT1_2; uy = -Math.SQRT1_2; } else { ux /= n; uy /= n; }
    const xs = poly.map(q => q[0]), ys = poly.map(q => q[1]);
    const rad = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2 * v.s;
    out.push(arrowTo(p.x * v.s + v.tx, p.y * v.s + v.ty, ux, uy, rad, col, sp));
  }
  return out.join('');
}
// an arrow pointing at (cx, cy) in screen px from direction (ux, uy), its tip rad + 3 off the centre, the label at its tail
function arrowTo(cx, cy, ux, uy, rad, col, label) {
  const tx = cx + ux * (rad + 3), ty = cy + uy * (rad + 3);            // tip just outside the target
  const L = 38, ex = tx + ux * L, ey = ty + uy * L;                    // tail
  const bx = tx + ux * 11, by = ty + uy * 11, nx = -uy * 5.5, ny = ux * 5.5;
  const head = tx + ',' + ty + ' ' + (bx + nx) + ',' + (by + ny) + ' ' + (bx - nx) + ',' + (by - ny);
  return '<line x1="' + ex + '" y1="' + ey + '" x2="' + bx + '" y2="' + by + '" stroke="#000" stroke-width="6"/>' +
    '<polygon points="' + head + '" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>' +
    '<line x1="' + ex + '" y1="' + ey + '" x2="' + bx + '" y2="' + by + '" stroke="' + col + '" stroke-width="3"/>' +
    '<polygon points="' + head + '" fill="' + col + '"/>' +
    '<text x="' + (ex + ux * 4) + '" y="' + (ey + uy * 4 + 4) + '" fill="' + col + '" text-anchor="' + (ux >= 0 ? 'start' : 'end') + '">' + esc(label) + '</text>';
}
// selected item: a ring on each of its spots ({x, y, label}: vias or other places that are not pads) and an arrow at it,
// coming from away from the item's centre
function spotArrows(it, col) {
  const v = S.view, out = [];
  for (const [i, sp] of (it.spots || []).entries()) {
    let ux = sp.x - it.x, uy = sp.y - it.y;
    const n = Math.hypot(ux, uy);
    if (n < 1e-3) { ux = -Math.SQRT1_2; uy = -Math.SQRT1_2; } else { ux /= n; uy /= n; }
    const cx = sp.x * v.s + v.tx, cy = sp.y * v.s + v.ty, rad = Math.max(7, (sp.r || 0.4) * v.s);
    out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + rad + '" fill="none" stroke="#000" stroke-width="5"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + rad + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>' +
      arrowTo(cx, cy, ux, uy, rad, col, sp.label || String(i + 1)));
  }
  return out.join('');
}

function hitItem(px, py) {
  let best = null;
  for (const [id, it] of Object.entries(S.items)) {
    if (!placed(it)) continue;
    const g = markerGeom(it);
    let d;
    if (g.box) d = Math.max(Math.abs(px - g.cx) - g.hw, Math.abs(py - g.cy) - g.hh, 0);
    else d = Math.max(0, Math.hypot(px - g.cx, py - g.cy) - g.r);
    const lab = g.box ? [g.cx + g.hw + 3, g.cy - g.hh - 3] : [g.cx + g.r * 0.72 + 2, g.cy - g.r * 0.72 - 2];
    if (px >= lab[0] - 2 && px <= lab[0] + 8 * id.length + 4 && py >= lab[1] - 14 && py <= lab[1] + 3) d = 0;
    if (d <= 6 && (!best || d < best[0])) best = [d, id];
  }
  return best && best[1];
}

// what is under a board point: the nearest pad of the shown side within 1.5 mm, else a footprint (same rule as the server)
function inside(poly, x, y) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [x0, y0] = poly[j], [x1, y1] = poly[i];
    if ((y0 > y) !== (y1 > y) && x < x0 + (y - y0) * (x1 - x0) / (y1 - y0)) c = !c;
  }
  return c;
}
function whatIsAt(x, y, side) {
  const d = S.board.dump, layer = cuLayer(side);
  let best = null;
  for (const p of d.pads) {
    if (!p.layers.includes(layer)) continue;
    const dist = p.poly && inside(p.poly, x, y) ? 0 : Math.hypot(p.x - x, p.y - y);
    if (dist <= 1.5 && (!best || dist < best[0])) best = [dist, p];
  }
  if (best) { const p = best[1]; return p.ref + ' ' + p.num + ' ' + (p.net || '(ネットなし)'); }
  const hits = d.footprints.filter(f => f.bbox[0] <= x && x <= f.bbox[2] && f.bbox[1] <= y && y <= f.bbox[3]);
  if (!hits.length) return '';
  const area = f => (f.bbox[2] - f.bbox[0]) * (f.bbox[3] - f.bbox[1]);
  hits.sort((a, b) => (a.side !== side) - (b.side !== side) || area(a) - area(b));
  const f = hits[0];
  return f.ref + ' (' + f.value + ') ' + sideName(f.side);
}

// ------------------------------------------------------------ board click: select a marker, or ask about the spot
function boardClick(e) {
  const r = view.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (S.hl) { S.hl = null; drawOverlay(); }
  const id = hitItem(px, py);
  if (id) { hidePop(); select(id, true); return; }
  const [x, y] = toMM(px, py);
  showPop(px, py, x, y);
}

function showPop(px, py, x, y) {
  const pop = $('pop'), side = S.layers.active;
  const what = whatIsAt(x, y, side);
  pop.innerHTML = '<div class="what">' + esc(what || '（部品なし）') + '</div>' +
    '<div class="xy">x ' + x.toFixed(2) + '  y ' + y.toFixed(2) + ' mm（' + esc(sideName(side)) + '）</div>' +
    '<div class="ask"><button id="askBtn">ここに質問</button></div>';
  pop.hidden = false;
  pop.style.left = Math.max(6, Math.min(px + 12, view.clientWidth - pop.offsetWidth - 6)) + 'px';
  pop.style.top = Math.max(6, Math.min(py + 12, view.clientHeight - pop.offsetHeight - 6)) + 'px';
  $('askBtn').onclick = () => {
    pop.querySelector('.ask').innerHTML = '<input id="askText" placeholder="質問（Enter で送信）"><button id="askSend">送信</button>';
    pop.style.left = Math.max(6, Math.min(px + 12, view.clientWidth - pop.offsetWidth - 6)) + 'px';
    const inp = $('askText');
    inp.focus();
    const send = async () => {
      const comment = inp.value.trim();
      if (!comment) return;
      try {
        const it = await api('/api/board/new', { x, y, side, comment });
        hidePop();
        S.items[it.id] = stripId(it);
        select(it.id, false);
        notice($('send'), '送信しました');
      } catch (err) { notice($('askSend'), 'エラー: ' + err.message); }
    };
    $('askSend').onclick = send;
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); send(); } else if (ev.key === 'Escape') hidePop(); });
  };
}
function hidePop() { $('pop').hidden = true; $('pop').innerHTML = ''; }

// ------------------------------------------------------------ item list
function renderList() {
  const list = $('list'), top = list.scrollTop;
  const ids = Object.keys(S.items).sort(byId);
  const all = ids.length, left = ids.filter(id => !DONE.has(stOf(S.items[id]))).length;
  const fixedN = ids.filter(id => stOf(S.items[id]) === '修正済み').length;
  $('progress').innerHTML = S.board ? '残り ' + left + ' / 全 ' + all + '<span class="fixed">　✔ 修正済み ' + fixedN + '</span>' : '';
  filt.paint();
  let html = '';
  for (const sev of [...SEVERITIES, '']) {
    const grp = ids.filter(id => sev ? S.items[id].severity === sev : !SEVERITIES.includes(S.items[id].severity));
    const shown = grp.filter(id => filt.keep(id, S.items[id], S.sel));
    if (!shown.length) continue;
    html += Review.groupHtml(sev || 'その他', shown.length);
    for (const id of shown) {
      const it = S.items[id];
      html += Review.rowHtml({ id, it: Object.assign({ owner: '未定' }, it), label: id, title: it.title, sel: id === S.sel });
    }
  }
  list.innerHTML = html || '<div class="empty">' + (!S.board ? '基板が開かれていません' : all ? '残りの項目はありません（「完了も表示」で全部）' : '項目はまだありません') + '</div>';
  list.scrollTop = top;
}

// ------------------------------------------------------------ detail
let detailSig = '';
const schLoaded = () => !!(Review.info() && Review.info().sch);
function renderDetail() {
  const it = S.sel && S.items[S.sel];
  foot.show();
  if (!it) {
    detailSig = '';
    $('detBody').innerHTML = '<div class="empty">項目を選ぶと、ここに内容が出ます。基板の上を押すと、その場所について質問できます。</div>';
    return;
  }
  const sig = S.sel + JSON.stringify(it) + schLoaded();
  if (sig === detailSig) return;
  detailSig = sig;
  const st = stOf(it);
  const where = (it.sides || []).map(sideName).join('・') + (placed(it) ? '　x ' + Number(it.x).toFixed(2) + '  y ' + Number(it.y).toFixed(2) + ' mm' : '');
  // each part links to the schematic page (a pin REF.NUM to its part) when a schematic is loaded
  const refLink = r => schLoaded() ? '<a href="/sch#ref=' + encodeURIComponent(r.replace(/\.[^.]+$/, '')) + '" target="kireview-sch" title="回路図で見る">' + esc(r) + '</a>' : esc(r);
  let h = '<div class="t">' + esc(S.sel) + '　' + esc(it.title) + '</div>' +
    Review.askHtml(Object.assign({ owner: '未定' }, it), '/figures/' + encodeURIComponent(S.board.stem) + '/') +
    '<div class="row"><span class="k">場所</span>' + esc(where) + '</div>' +
    '<div class="row"><span class="k">部品</span>' + (it.refs && it.refs.length ? it.refs.map(refLink).join(', ') : '<span class="none">-</span>') +
    (it.near ? '<span class="meaning">' + esc(it.near) + '</span>' : '') + '</div>' +
    (it.pins && it.pins.length ? '<div class="row"><span class="k">ピン</span>' + esc(it.pins.join(', ')) + '<span class="meaning">（基板の図で矢印）</span></div>' : '') +
    (it.spots && it.spots.length ? '<div class="row"><span class="k">しるし</span>' + esc(it.spots.map((s, i) => s.label || String(i + 1)).join(', ')) + '<span class="meaning">（基板の図で矢印）</span></div>' : '') +
    '<div class="row"><span class="k">状態</span><span class="badge ' + Review.stClass(st) + '">' + (ST_MARK[st] || '') + ' ' + esc(ST_NAME[st] || st) + '</span></div>';
  h += Review.notesHtml(it) + Review.threadHtml(it.thread);
  $('detBody').innerHTML = h;
  Review.bindFigures($('detBody'));
  seen();
}

// the selected item's unread reply is on screen: tell the server
function seen() {
  const id = S.sel, it = id && S.items[id];
  if (it) Review.markSeen(page(), id, it, r => { if (S.items[id]) { S.items[id] = stripId(r); renderAll(); } });
}

const foot = Review.footer({
  page,
  current: () => S.sel && S.items[S.sel] ? [S.sel, S.items[S.sel]] : null,
  title: () => undefined,                      // a board item keeps its own title
  next: () => Review.neighbor(S.sel, 1),
  update(id, r, next) {
    S.items[id] = stripId(r);
    if (next && S.items[next]) select(next, true);
    else renderAll();
  },
});

function stripId(r) { const o = Object.assign({}, r); delete o.id; delete o.rev; delete o.page; return o; }

// ------------------------------------------------------------ selection
function select(id, move) {
  const it = S.items[id];
  if (!it) return;
  S.sel = id;
  S.hl = null;
  if (move && placed(it)) {
    clearWhole();
    const pads = itemPads(it);
    let side = (it.sides || ['F'])[0];
    if (pads.length) {                 // pins given: show the side the first pin is on (an SMD pad is on one side only)
      const L = pads[0][1].layers, f = L.includes('F.Cu'), bk = L.includes('B.Cu');
      if (f && !bk) side = 'F';
      else if (bk && !f) side = 'B';
    }
    const cuSides = (it.sides || []).filter(s => copperKeys().includes(s));
    if (cuSides.length > 1) setMulti(cuSides, cuSides.includes(side) ? side : cuSides[0]);
    else if (side === 'F' || side === 'B') setPreset(side);
    else if (copperKeys().includes(side)) setPreset('In', side);
    const spots = it.spots || [];
    if (pads.length || spots.length) { // pins or spots given: frame them, closer than an area
      const xs = [...pads.flatMap(([, p]) => padPoly(p).map(q => q[0])), ...spots.map(s => s.x)];
      const ys = [...pads.flatMap(([, p]) => padPoly(p).map(q => q[1])), ...spots.map(s => s.y)];
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      focusOn((x0 + x1) / 2, (y0 + y1) / 2, Math.max(PIN_FOCUS_MM, (x1 - x0) * 1.6, (y1 - y0) * 1.6));
    } else {
      const span = Math.max(FOCUS_MM, (it.w || 0) * 1.5, (it.h || 0) * 1.5, (it.r || 0) * 4);
      focusOn(it.x, it.y, span);
    }
  }
  renderAll();
  const row = document.querySelector('#list .item.sel');
  if (row) row.scrollIntoView({ block: 'nearest' });
}

function deselect() { S.sel = null; renderAll(); }

function renderAll() { renderList(); renderDetail(); drawOverlay(); }

// #ref=<REF>: show that part (its side, framed), and the popup at its centre so it can be asked about
function gotoRef(ref) {
  const f = S.board && S.board.dump.footprints.find(p => p.ref === ref);
  if (!f) { notice($('bname'), ref + ' は基板にありません'); return; }
  clearWhole();
  setPreset(f.side === 'B' ? 'B' : 'F');
  const b = f.bbox, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  focusOn(cx, cy, Math.max(PIN_FOCUS_MM, (b[2] - b[0]) * 2.5, (b[3] - b[1]) * 2.5));
  S.hl = { ref, bbox: b };
  drawOverlay();
  showPop(cx * S.view.s + S.view.tx, cy * S.view.s + S.view.ty, cx, cy);
}
function takeRef() { const r = Review.takeRef(); if (r) gotoRef(r); }

// ------------------------------------------------------------ the talk state (long poll)
function onTalk(d) {
  if (!S.board || d.page !== page()) return;
  S.items = d.items || {};
  if (S.sel && !S.items[S.sel]) S.sel = null;
  renderAll();
}

// ------------------------------------------------------------ board: open, reload after a save in KiCad
function showBoardStatus(st, err) {
  const el = $('bstat');
  el.textContent = st === 'reloading' ? '再読み込み中' : st === 'error' ? '書き出し失敗' : '';
  el.classList.toggle('err', st === 'error');
  el.title = err || '';
}

// a board from GET /api/board or POST /api/board/open: the header, the layers, the review
async function applyBoard(b) {
  const first = !S.board || S.board.board !== b.board;
  S.board = b;
  $('noBoard').hidden = true;
  $('bname').textContent = b.stem;
  $('bfile').textContent = b.board;
  $('bfile').title = b.board;
  document.title = b.stem + ' 基板レビュー';
  buildLayerBoxes();
  if (first) {
    let saved = null;
    try { saved = JSON.parse(store.get('kireview.layers') || 'null'); } catch (_) {}
    const names = b.layers.map(l => l.name);
    if (saved && saved.vis && copperKeys().includes(saved.active)) S.layers = { preset: saved.preset, active: saved.active, vis: saved.vis.filter(n => names.includes(n)) };
    else S.layers = { preset: 'F', active: 'F', vis: presetLayers('F') };
    S.sel = null;
    S.hl = null;
    if (conn && conn.page !== b.review.page) S.items = {};   // another review: its items come with the next state
    fitBoard();
  }
  await loadLayerImages();
  showBoardStatus(b.status, b.error);
  if (!conn) conn = Review.connect(b.review.page, onTalk);
  else conn.setPage(b.review.page);
  renderAll();
}

function noBoard(d) {
  S.board = null;
  $('noBoard').hidden = false;
  renderAll();
  openPicker(d.hint);
}

async function pollBoard() {
  let v;
  try { v = await api('/api/board/version'); } catch (_) { return; }
  if (!v.version) return;
  if (!S.board || v.version !== S.board.version) {    // re-exported after a save in KiCad, or opened from elsewhere
    showBoardStatus('reloading');
    const b = await api('/api/board');
    if (!b.empty) await applyBoard(b);
  }
  showBoardStatus(v.status, v.error);
}

// ------------------------------------------------------------ board picker
const parentDir = p => { const q = String(p || '').replace(/[\\/]+$/, ''); const i = q.search(/[\\/][^\\/]*$/); return i > 0 ? q.slice(0, i) : ''; };
const baseName = p => String(p || '').split(/[\\/]/).pop();
// the projects beside the board's project: the parent of the folder that holds the .kicad_pcb
const projectsDir = p => /\.kicad_pcb$/i.test(p || '') ? parentDir(parentDir(p)) : String(p || '').replace(/[\\/]+$/, '');
async function fillProjects(dir) {
  const box = $('pickProj');
  box.innerHTML = '';
  const head = document.createElement('option');
  head.value = '';
  head.textContent = dir ? 'プロジェクト一覧（' + dir + '）' : 'プロジェクト一覧（パスを入れると出る）';
  head.disabled = true;
  box.appendChild(head);
  box.value = '';
  if (!dir) return;
  try {
    const r = await api('/api/projects?dir=' + encodeURIComponent(dir));
    for (const pr of r.projects.filter(p => p.pcb)) {
      const o = document.createElement('option');
      o.value = pr.pcb;
      o.textContent = pr.name;
      o.title = pr.pcb;
      box.appendChild(o);
    }
    const cur = $('pickPath').value.replace(/\\/g, '/');
    if ([...box.options].some(o => o.value === cur)) box.value = cur;
  } catch (err) { head.textContent = '一覧の取得失敗: ' + err.message; }
}
function openPicker(hint) {
  const p = $('picker'), r = $('pickBtn').getBoundingClientRect();
  p.style.top = r.bottom + 6 + 'px';
  p.style.left = Math.max(8, Math.min(r.left, innerWidth - 576)) + 'px';
  const cur = S.board ? S.board.board : '';
  $('pickPath').value = cur || hint || '';
  const hb = $('pickHint');
  hb.hidden = !hint;
  if (hint) { hb.textContent = baseName(hint) + ' を開く'; hb.title = hint; hb.onclick = () => { $('pickPath').value = hint; openBoard(hb); }; }
  $('pickMsg').textContent = '';
  p.hidden = false;
  fillProjects(projectsDir(cur || hint));
}
const pickerOpen = () => !$('picker').hidden;
async function openBoard(btn) {
  const path = $('pickPath').value.trim();
  if (!path) { notice(btn, '.kicad_pcb のパスを指定'); return; }
  $('pickMsg').textContent = '書き出し中…';
  document.querySelectorAll('#picker button').forEach(b => { b.disabled = true; });
  try {
    const b = await api('/api/board/open', { path });
    $('picker').hidden = true;
    await applyBoard(b);
    notice($('pickBtn'), b.stem + ' を開きました');
  } catch (err) { notice(btn, 'エラー: ' + err.message); }
  finally {
    $('pickMsg').textContent = '';
    document.querySelectorAll('#picker button').forEach(b => { b.disabled = false; });
  }
}

// ------------------------------------------------------------ layout: panels, keys, buttons
function initLayout() {
  Review.init('board');
  Review.docks('kireview.board', redraw);
  Review.arrowKeys(() => !$('pop').hidden || pickerOpen(), d => { const id = Review.neighbor(S.sel, d); if (id) select(id, true); });
  let schOn = null;
  Review.onInfo(i => { if (!!i.sch !== schOn) { schOn = !!i.sch; renderDetail(); } });   // the links to the schematic
  $('list').addEventListener('click', e => { const row = e.target.closest('.item'); if (row) select(row.dataset.id, true); });
  $('padText').checked = S.padText;
  $('padText').addEventListener('change', e => { S.padText = e.target.checked; store.set('kireview.padText', S.padText ? '1' : '0'); drawOverlay(); });
  $('fillBox').checked = S.fills;
  $('fillBox').addEventListener('change', e => { S.fills = e.target.checked; store.set('kireview.fills', S.fills ? '1' : '0'); if (S.board) applyLayers(); });
  $('courtBox').checked = S.court;
  $('courtBox').addEventListener('change', e => { S.court = e.target.checked; store.set('kireview.court', S.court ? '1' : '0'); if (S.board) applyLayers(); });
  $('fit').addEventListener('click', toggleWhole);
  $('reload').addEventListener('click', async e => {
    const btn = e.currentTarget;
    try { await api('/api/board/reload', {}); showBoardStatus('reloading'); notice(btn, '読み直します'); } catch (err) { notice(btn, 'エラー: ' + err.message); }
  });
  $('pickBtn').addEventListener('click', async () => {
    if (pickerOpen()) { $('picker').hidden = true; return; }
    let hint = null;
    if (!S.board) { try { hint = (await api('/api/board')).hint; } catch (_) {} }
    openPicker(hint);
  });
  $('pickClose').addEventListener('click', () => { $('picker').hidden = true; });
  $('pickOpen').addEventListener('click', e => openBoard(e.currentTarget));
  $('pickProj').addEventListener('change', e => { $('pickPath').value = e.target.value; });
  $('pickPath').addEventListener('change', e => fillProjects(projectsDir(e.target.value.trim())));
  $('pickPath').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); openBoard($('pickOpen')); } });
  document.querySelectorAll('#presets button').forEach(b => b.addEventListener('click', () => { if (S.board) setPreset(b.dataset.p); }));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (pickerOpen()) { $('picker').hidden = true; return; }
    if (!$('pop').hidden) { hidePop(); return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { document.activeElement.blur(); return; }
    if (S.hl) { S.hl = null; drawOverlay(); }
    deselect();
  });
  document.addEventListener('pointerdown', e => { if (!$('pop').hidden && !e.target.closest('#pop') && !e.target.closest('#view')) hidePop(); });
  document.addEventListener('visibilitychange', seen);
  addEventListener('hashchange', takeRef);
  addEventListener('resize', redraw);
  // the board was fitted before the view had a size (a page opened in the background): fit it once it has one
  new ResizeObserver(() => { if (S.board && !S.view.s && view.clientWidth && view.clientHeight) fitBoard(); }).observe(view);
}

async function main() {
  initLayout();
  initPanZoom();
  renderAll();
  let b;
  try { b = await api('/api/board'); } catch (err) { notice($('bname'), '読み込み失敗: ' + err.message); return; }
  if (b.empty) noBoard(b);
  else await applyBoard(b);
  takeRef();
  setInterval(pollBoard, POLL_MS);
}
main();
</script>
