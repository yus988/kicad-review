<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回路図 レビュー</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔀</text></svg>">
<link rel="stylesheet" href="/review.css">
<style>
:root {
  --add: #1a9a36; --rem: #d33a2c; --chg: #e08a00; --pin: #2b6fd6; --sub: #2b6fd6; --grp: #7a4fc9; --lab: #a03ad6;
  --ask: #7a4fc9; --info: #343a40;   /* drawing marks: not reviewed yet / just the picked part (reviewed: the status colours) */
}
header .grow { flex: 1; }
#cmpBtn { flex: 0 1 auto; min-width: 6em; max-width: 40em; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
body.single .bside { display: none !important; }
#cmp { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 10px; width: 560px; max-width: calc(100vw - 16px); }
#cmp[hidden] { display: none; }
.cmp-side { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin-bottom: 10px; }
.cmp-side select, .cmp-side input { font: inherit; width: 100%; padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
.cmp-side .k { grid-row: span 3; align-self: start; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.cmp-opts { display: flex; gap: 10px; align-items: center; margin: 0 0 10px; }
.cmp-opts label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.cmp-btns { display: flex; gap: 6px; align-items: center; }
.cmp-btns .grow { flex: 1; }
#recent { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; max-height: 180px; overflow: auto; }
#recent button { text-align: left; overflow: hidden; text-overflow: ellipsis; }
.cmp-t { color: var(--muted); font-size: 12px; margin-top: 10px; }
.tag { display: inline-block; min-width: 20px; text-align: center; font-weight: 700; color: #fff; border-radius: 3px; padding: 0 4px; }
.tag.a { background: var(--rem); } .tag.b { background: var(--add); }
.group { display: flex; gap: 4px; align-items: center; }
#status { color: var(--muted); width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a { color: var(--sub); }

/* panels: list, detail */
.list-h { flex-wrap: wrap; }
#progress { flex: 1 1 100%; width: auto; }
#filter { order: 1; flex: 1 1 0; min-width: 0; font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; }
#showUnread, #showDone { order: 2; }
.item .ds { position: absolute; right: 8px; bottom: 5px; font-size: 11px; display: none; background: #fff; padding: 0 4px; border-radius: 3px; }
.item:hover .ds { display: inline; }
.k-comp_added, .k-sheet_added, .k-net_added { color: var(--add); }
.k-comp_removed, .k-sheet_removed, .k-net_removed { color: var(--rem); }
.k-comp_changed, .k-renumbered { color: var(--chg); }
.k-pin_moved, .k-net_renamed { color: var(--pin); }
.k-label_changed { color: var(--lab); }
.k-sheet_renamed { color: var(--lab); }
.k-group { color: var(--grp); }
.member.folded { color: var(--muted); }
.folded-note { margin: 6px 0 2px; padding: 4px 8px; border-left: 3px solid var(--line); }
.folded-note b { color: var(--muted); font-weight: 600; }
#detail .key { color: var(--muted); font-size: 11px; }
#detail pre { margin: 4px 0 6px; white-space: pre-wrap; word-break: break-all; font: 12px/1.45 ui-monospace, Consolas, monospace; background: #fff;
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; }
.members { display: flex; flex-direction: column; gap: 2px; }
.member { display: block; width: 100%; text-align: left; white-space: normal; padding: 3px 7px; }
.member small { display: block; color: var(--muted); white-space: pre-wrap; }
.member.hl { background: #ffe6f6; border-color: var(--sel); }
.dslinks a { margin-right: 10px; }

/* drawing */
/* drawing toolbar: the sheet tabs, then the view controls */
#nav { display: flex; align-items: flex-end; gap: 8px; padding: 4px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
#stabs { position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden;
  white-space: nowrap; scrollbar-width: none; margin-bottom: -1px; }   /* no scrollbar (the wheel scrolls): the row keeps its height */
#stabs::-webkit-scrollbar { display: none; }
.stab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 4px; border: 1px solid var(--line);
  border-bottom-color: var(--line); border-radius: 6px 6px 0 0; background: #ecece8; color: var(--muted); }
.stab:hover { background: #e2e2dc; color: var(--text); }
.stab.on { background: var(--panel); color: var(--text); font-weight: 700; border-bottom-color: var(--panel); }
.stab .cnt { display: inline-block; min-width: 1.6em; text-align: center; border-radius: 9px; padding: 0 5px; font-size: 11px;
  font-weight: 700; background: var(--chg); color: #fff; }
.stab .cnt.zero, body.single .stab .cnt, body.nodiff .stab .cnt { background: #bbb; }
.stab small { font-weight: 400; opacity: .7; }
.navR { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; padding-bottom: 4px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
#helpTip { display: inline-flex; align-items: center; justify-content: center; width: 1.7em; height: 1.7em; border: 1px solid var(--line);
  border-radius: 50%; color: var(--muted); cursor: help; font-weight: 700; user-select: none; }
#pairPop { width: auto; color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
#pairPop[hidden] { display: none; }
#pairPop select { font: inherit; width: 14em; padding: 1px 2px; border: 1px solid var(--line); border-radius: 4px; color: var(--text); }
#views { position: relative; display: flex; gap: 4px; padding: 4px; min-width: 0; min-height: 0; }
.pane { position: relative; flex: 1; overflow: hidden; background: #fff; border: 1px solid var(--line); cursor: grab; touch-action: none; }
.pane.drag { cursor: grabbing; }
.pane.hot { cursor: pointer; }
.pane .lbl { position: absolute; left: 6px; top: 4px; z-index: 5; font-size: 12px; background: rgba(255,255,255,.85); padding: 1px 6px; border-radius: 3px; pointer-events: none; }
.pane .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; isolation: isolate; background: #fff; }
.stage .layer { position: absolute; inset: 0; background: #fff; }
.stage img, .stage svg.marks { position: absolute; left: 0; top: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.stage img.ghost { opacity: .28; }            /* 重ね表示: A in light red under B */
svg.marks { pointer-events: none; overflow: visible; }
svg.marks rect { fill: none; vector-effect: non-scaling-stroke; }
svg.marks rect.sub { stroke: none; fill: rgba(43,111,214,0); }
svg.marks rect.sub.hot { stroke: var(--sub); stroke-width: 2px; fill: rgba(43,111,214,.08); }
/* arrows and field frames are drawn in screen pixels so they keep their size at any zoom */
svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 4; }
svg.arrows g { pointer-events: visiblePainted; cursor: pointer; }
svg.arrows .halo { stroke: #fff; stroke-width: 4.5; fill: none; stroke-linecap: round; }
svg.arrows .shaft { stroke-width: 1.8; fill: none; stroke-linecap: round; }
svg.arrows .hit { stroke: transparent; stroke-width: 14; fill: none; }
svg.arrows .frame { fill: transparent; stroke-width: 1.2; }
svg.arrows .glow { fill: none; stroke-opacity: .35; stroke-linecap: round; stroke-linejoin: round; }
svg.arrows .frame.info { stroke-dasharray: 5 3; }
svg.arrows g.sel .shaft { stroke-width: 3.2; }
svg.arrows g.sel .halo { stroke-width: 6.5; }
svg.arrows g.sel .frame { stroke-width: 2.4; }
svg.arrows g.dim { opacity: .22; }
svg.arrows g.hover .glow { stroke-opacity: .85; }
svg.arrows text { font: 700 11px system-ui, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
svg.arrows text.ref { font-size: 12px; stroke-width: 4px; }
#flipbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6; display: none; align-items: center; gap: 0;
  background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
#flipbar button { width: 4.2em; border: none; border-radius: 4px; font-weight: 700; }
#flipbar button.on.a { background: var(--rem); } #flipbar button.on.b { background: var(--add); }
#flipbar span { color: var(--muted); font-size: 12px; padding: 0 8px; }
#legend { position: absolute; right: 12px; bottom: 12px; z-index: 6; background: rgba(255,255,255,.92); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 9px; font-size: 12px; }
#legend:empty { display: none; }
#legend b { font-weight: 700; }
</style>
</head>
<body>
<header id="hdr">
  <div id="tabs"></div>
  <button id="cmpBtn">比較対象</button>
  <span id="status"></span>
  <span class="grow"></span>
  <span id="presence"></span>
  <button id="pageNew" class="off" title="このページの新しい版があります。押すと読み込み直す（入力中のコメントは残る）">画面を更新</button>
</header>
<div id="cmp" hidden>
  <div class="cmp-side" data-side="a">
    <div class="k"><span class="tag a">A</span><button data-open="a" title="読み込み中の A を KiCad で開く">KiCad 起動</button></div>
    <select class="proj" title="親フォルダとその下 2 階層の KiCad プロジェクト"></select>
    <input class="path" placeholder="フォルダ / .kicad_sch のパス" spellcheck="false">
    <select class="ref" title="git の版"></select>
  </div>
  <div class="cmp-side" data-side="b">
    <div class="k"><span class="tag b">B</span><button data-open="b" title="読み込み中の B を KiCad で開く">KiCad 起動</button></div>
    <select class="proj" title="親フォルダとその下 2 階層の KiCad プロジェクト"></select>
    <input class="path" placeholder="空欄なら A の 1 設計だけをレビュー" spellcheck="false">
    <select class="ref" title="git の版"></select>
  </div>
  <div class="cmp-opts"><label title="2 つの設計の差分を一覧と矢印に出す（外すと並べるだけ。図の部品を押すと質問できる）"><input type="checkbox" id="diffChk">差分を出す</label>
    <button id="reload" title="読み込み中の回路図を書き出し直す">再読み込み</button></div>
  <div class="cmp-btns"><button id="cmpSwap">入れ替え</button><button id="cmpClearB">B なし</button><span class="grow"></span><button id="cmpClose">閉じる</button><button id="cmpRun" class="on">比較</button></div>
  <div class="cmp-t">最近の比較</div>
  <div id="recent"></div>
</div>
<div id="lb" hidden></div>
<div id="work">
<div id="upper">
<div id="dockL" class="dock"></div><div class="dsplit" data-dock="L"></div>
<div id="center">
  <div id="nav">
    <div id="stabs"></div>
    <div class="navR">
      <button id="pairBtn" class="bside" title="このシートと対応させる A・B のシート（別の基板どうしで手動で対応させる）">対応</button>
      <div class="seg bside" id="modes"><button data-mode="side" class="on" title="A と B を並べて表示">並べて</button><button data-mode="overlay" title="B の下に A を薄い赤で重ねて表示">重ね</button><button data-mode="flip" title="A と B を切り替えて表示（Space）">切替</button></div>
      <button id="fit" title="シート全体を表示">全体</button>
      <span id="helpTip" title="シート枠をダブルクリック / Ctrl+クリックで下の階層へ・Backspace / Alt+← で上の階層へ・矢印を押すと一覧の項目へ・Esc か図の空き部分で選択解除">?</span>
    </div>
  </div>
  <div id="views">
    <div id="flipbar"><button data-flip="a" class="a">A</button><button data-flip="b" class="b on">B</button><span>Space で切替</span></div>
    <div id="legend"></div>
  </div>
</div>
<div class="dsplit" data-dock="R"></div><div id="dockR" class="dock"></div>
</div>
<div class="dsplit" data-dock="B"></div><div id="dockB" class="dock"></div>
<section class="panelbox" data-panel="list"><div class="ptitle"><span class="grip">⠿</span>一覧</div>
  <div class="list-h"><span id="progress"></span><button id="showUnread">未読も表示</button><button id="showDone">完了も表示</button><input id="filter" placeholder="絞り込み" spellcheck="false"></div>
  <div id="list"></div>
</section>
<section class="panelbox" data-panel="detail"><div class="ptitle"><span class="grip">⠿</span>詳細</div>
  <div id="detail"><div id="detBody"></div>
    <div id="post" hidden>
      <div class="review-btns" id="stBtns"></div>
      <div class="post-row"><textarea id="comment" rows="1" placeholder="コメント・質問（エージェントに届く。Ctrl+Enter で送信）"></textarea><button id="send">送信</button></div>
    </div>
  </div>
</section>
</div>
<div id="pairPop" class="panel" hidden>対応
  <span class="tag a">A</span><select id="pairA"></select>⇔<span class="tag b">B</span><select id="pairB"></select></div>
<script src="/review.js"></script>
<script>
'use strict';
const { $, esc, store, api, notice, DONE, ST_NAME } = Review;
const KIND_COLOR = { comp_added: '--add', comp_removed: '--rem', comp_changed: '--chg', pin_moved: '--pin',
  net_added: '--pin', net_removed: '--pin', net_renamed: '--pin', sheet_added: '--add', sheet_removed: '--rem', part: '--sel', group: '--grp',
  label_changed: '--lab', sheet_renamed: '--lab' };
const KIND_LABEL = { comp_added: '追加', comp_removed: '削除', comp_changed: '値・フィールド', pin_moved: '接続', part: '', group: 'まとめ',
  label_changed: 'ラベル変更', sheet_renamed: 'シート名変更' };
const ONLY_SIDE = { comp_added: 'b', comp_removed: 'a' };   // where the thing exists
// drawing colours of a reviewed entry (white background) and the mark at the arrow tail
const ST_DRAW = { 'このまま': '#7a7f85', '修正を依頼': '#e07000', '自分で修正': '#e07000', '修正済み': '#1a9a36', '質問': '#c020c0' };
const ST_ARROW = { 'このまま': '✓', '修正を依頼': '⚑', '自分で修正': '✎', '修正済み': '✔', '質問': '？' };
const STATUS_PRIO = { '修正を依頼': 5, '自分で修正': 5, '質問': 4, '': 3, '修正済み': 2, 'このまま': 1 };   // merged arrows: the most urgent wins
const PX_PER_MM = 4;            // stage resolution before the view transform
const DETAIL_RIGHT_W = 380;
const ARROW_PX = 40;            // arrow length on screen
const MERGE_PX = 16;            // arrow tips closer than this are drawn as one
let S = null, sheet = '/', mode = 'side', flipSide = 'b', filterText = '';
let E = [], itemEntry = [];     // list entries (items, or groups of items); item index -> entry index
let EK = {};                    // entry key -> entry index
let sel = null;                 // selected entry index
let hoverItem = null;           // item under the mouse (member list or arrow): emphasised in both places
let R = { items: {}, groups: [] };   // the talk state of the review: key -> item, groups
let conn = null;                // talk long poll
const markerCycle = {};         // merged marker -> next entry to select
const view = { s: 1, x: 0, y: 0 };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const EMPTY = { status: '', thread: [] };
const filt = Review.filters('kireview.sch', () => renderList());

function status(t) { $('status').textContent = t || ''; $('status').title = t || ''; }

function sheetInfo(name) { return S && S.sheets.find(s => s.name === name); }
function sheetDims(sh) {  // mm extent covering both sides
  const a = sh.a ? sh.a.box : [0, 0, 0, 0], b = sh.b ? sh.b.box : [0, 0, 0, 0];
  return [Math.max(a[2], b[2]), Math.max(a[3], b[3])];
}
function sheetLabel(name) { return name === '/' ? 'ルート' : name.split('/').filter(Boolean).pop(); }
function parentOf(name) {
  const p = name.split('/').filter(Boolean);
  p.pop();
  return p.length ? '/' + p.join('/') + '/' : '/';
}
function rv(key) { return R.items[key] || EMPTY; }
function stripId(r) { const o = Object.assign({}, r); delete o.id; delete o.rev; delete o.page; return o; }

// ---------------------------------------------------------------- entries: items, and groups of items sharing one reason
function buildEntries() {
  E = [];
  itemEntry = [];
  EK = {};
  if (!S) return;
  const byKey = {};
  S.items.forEach((it, i) => { byKey[it.key] = i; });
  const foldedInto = {};          // pin item key folded into a label change -> that label item's index
  S.items.forEach((it, i) => (it.folds || []).forEach(k => { foldedInto[k] = i; }));
  const taken = new Set();
  for (const g of R.groups || []) {
    const members = g.keys.map(k => byKey[k]).filter(i => i !== undefined && !taken.has(i));
    const folded = g.keys.filter(k => byKey[k] === undefined && foldedInto[k] !== undefined).map(k => ({ key: k, into: foldedInto[k] }));
    if (!members.length && !folded.length) continue;
    members.forEach(i => taken.add(i));
    const first = S.items[members.length ? members[0] : folded[0].into];
    E.push({ key: 'group:' + g.id, kind: 'group', group: g, items: members, folded, sheet: first.sheet, title: g.title,
             detail: members.map(i => S.items[i].title).concat(folded.map(f => f.key + '（ラベル変更に統合）')).join('\n'),
             ds: { a: null, b: null } });
  }
  S.items.forEach((it, i) => {
    if (!taken.has(i)) E.push({ key: it.key, kind: it.kind, group: null, items: [i], sheet: it.sheet, title: it.title, detail: it.detail, ds: it.ds });
  });
  E.forEach((e, n) => { EK[e.key] = n; e.items.forEach(i => { itemEntry[i] = n; }); });
}

function matches(e) { return !filterText || (e.title + '\n' + e.detail).toLowerCase().includes(filterText); }
// reviewed: the entry has a status, a thread, an intent or a severity (the agent's finding)
function reviewed(e) {
  const r = rv(e.key);
  return !!(r.status || (r.thread || []).length || r.rationale || r.severity || (e.group && e.group.rationale));
}
// what a mark on the drawing means: 'info' = a part picked in the drawing with nothing to decide (a frame while
// selected), 'ask' = something for the user to review (a change, a group, or a reviewed part): its arrow always stays on
// the drawing, coloured by its status
function markKind(e) { return e.kind === 'part' && !reviewed(e) ? 'info' : 'ask'; }
// two designs with the diff shown: a part entry stays out of the list, the counts and the arrows until it is
// selected (a click on the part in the drawing) or reviewed
function quiet(e) { return e.kind === 'part' && !!S.items[e.items[0]].quiet && !reviewed(e); }
function shown(n) { return n === sel || !quiet(E[n]); }
function countOn(name) { return E.filter((e, n) => e.sheet === name && shown(n)).length; }
const keyEntry = key => { const i = S.items.findIndex(it => it.key === key); return i >= 0 ? itemEntry[i] : -1; };

// ---------------------------------------------------------------- header, navigation, list
function renderHeader() {
  document.body.classList.toggle('single', !S || S.single);
  // the header names A → B in one button that opens the 比較対象 panel; the full paths in its tooltip
  const b = $('cmpBtn'), sd = S && S.sides;
  b.textContent = !S ? '比較対象を選ぶ' : S.single ? (sd.a.disp || sd.a.short) + '（1 設計）' : sd.a.short + ' → ' + sd.b.short;
  b.title = !S ? '回路図を選ぶ' : ['a', 'b'].filter(k => sd[k]).map(k => k.toUpperCase() + ': ' + (sd[k].disp || sd[k].short) + '\n   ' +
    sd[k].label + (sd[k].readonly ? '（git から書き出した読み取り専用コピー）' : '')).join('\n') + '\n押すと比較対象を選ぶ';
  document.title = !S ? '回路図 レビュー' : (S.single ? sd.a.short : sd.a.short + ' → ' + sd.b.short) + ' レビュー';
  document.body.classList.toggle('nodiff', !!S && !S.single && !S.show_diff);
  $('diffChk').checked = !!S && !S.single && !!S.show_diff;
  $('diffChk').disabled = !S || S.single;
  $('reload').disabled = !S;
  document.querySelectorAll('[data-open]').forEach(btn => { btn.disabled = !S || !sd[btn.dataset.open]; });
}

function fillPair() {           // sheet pairing: every sheet of each side by its own path
  for (const k of ['a', 'b']) {
    const box = $('pair' + k.toUpperCase());
    box.innerHTML = '';
    option(box, '', '（なし）');
    for (const p of S.paths[k]) option(box, p, p);
  }
}

// a sheet tab: nested sheets as 親 › 子
function sheetTabLabel(name) { return name === '/' ? 'ルート' : name.split('/').filter(Boolean).join(' › '); }

function renderNav() {
  const tabs = $('stabs');
  tabs.innerHTML = '';
  if (!S) return;
  for (const sh of S.sheets) {
    const n = countOn(sh.name), b = document.createElement('button');
    b.className = 'stab' + (sh.name === sheet ? ' on' : '');
    b.title = sh.name + (S.single || !S.show_diff ? '（部品 ' : '（項目 ') + n + ' 件）';
    b.innerHTML = '<span></span><span class="cnt"></span>';
    b.firstChild.textContent = sheetTabLabel(sh.name);
    b.lastChild.textContent = n;
    if (!n) b.lastChild.classList.add('zero');
    if (!S.single && (!sh.a || !sh.b)) { const m = document.createElement('small'); m.textContent = !sh.a ? 'B のみ' : 'A のみ'; b.insertBefore(m, b.lastChild); }
    b.onclick = () => setSheet(sh.name, true);
    tabs.appendChild(b);
  }
  const cur = tabs.querySelector('.stab.on');       // keep the current tab in view (the row scrolls, it does not wrap)
  if (cur) {
    if (cur.offsetLeft < tabs.scrollLeft) tabs.scrollLeft = cur.offsetLeft;
    else if (cur.offsetLeft + cur.offsetWidth > tabs.scrollLeft + tabs.clientWidth) tabs.scrollLeft = cur.offsetLeft + cur.offsetWidth - tabs.clientWidth;
  }
  if (S.single) return;
  // the A / B sheets shown here; changing one pairs it with the other side's sheet on show
  const sh = sheetInfo(sheet) || {}, pa = $('pairA'), pb = $('pairB');
  pa.value = sh.apath || ''; pb.value = sh.bpath || '';
  pa.title = sh.apath || 'A のシートなし'; pb.title = sh.bpath || 'B のシートなし';
  pa.disabled = !sh.bpath;
  pb.disabled = !sh.apath;
}

function renderProgress() {
  filt.paint();
  if (!S) { $('progress').textContent = ''; return; }
  const list = E.filter((e, n) => shown(n));
  const left = list.filter(e => !DONE.has(rv(e.key).status || '')).length;
  const fixed = list.filter(e => rv(e.key).status === '修正済み').length;
  $('progress').innerHTML = '残り ' + left + ' / 全 ' + list.length + '<span class="fixed">　✔ 修正済み ' + fixed + '</span>';
}

function entryRow(n) {
  const e = E[n], ds = e.ds.b || e.ds.a;
  return Review.rowHtml({
    id: e.key, it: R.items[e.key], wrap: true, sel: sel === n, titleClass: 'k-' + e.kind, detail: e.detail,
    title: (e.group ? '［まとめ ' + (e.items.length + e.folded.length) + ' 件］ ' : '') + e.title,
    extra: ds ? '<a class="ds" href="' + esc(ds) + '" target="_blank" rel="noopener" title="' + esc(ds) + '">データシート</a>' : '',
  });
}

function renderList() {
  const box = $('list');
  const top = box.scrollTop;
  renderProgress();
  if (!S) { box.innerHTML = '<div class="empty">回路図が読み込まれていません（「比較対象」で選ぶ）</div>'; return; }
  if (!E.some((e, n) => shown(n))) { box.innerHTML = '<div class="empty">差分なし（テキスト・図形の変更は対象外）</div>'; return; }
  const selKey = sel !== null && E[sel] ? E[sel].key : null;
  const order = S.sheets.map(s => s.name);
  const groups = {};
  E.forEach((e, n) => {
    if ((shown(n) && matches(e) && filt.keep(e.key, R.items[e.key], selKey)) || n === sel) (groups[e.sheet] = groups[e.sheet] || []).push(n);
  });
  const names = Object.keys(groups).sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));
  if (!names.length) { box.innerHTML = '<div class="empty">' + (filterText ? '該当なし' : '残りの項目はありません（「完了も表示」で全部）') + '</div>'; return; }
  let html = '';
  for (const name of names) {
    html += Review.groupHtml('シート ' + sheetLabel(name), groups[name].length, 'click' + (name === sheet ? ' cur' : ''), ' data-sheet="' + esc(name) + '"');
    for (const n of groups[name]) html += entryRow(n);
  }
  box.innerHTML = html;
  box.scrollTop = top;
}

// ---------------------------------------------------------------- detail + review
function dsLinks(ds) {
  const out = [];
  if (ds.a && ds.b && ds.a !== ds.b) { out.push(['データシート A', ds.a]); out.push(['データシート B', ds.b]); }
  else if (ds.b || ds.a) out.push(['データシート', ds.b || ds.a]);
  return out;
}
function linkRow(ds) {
  const p = document.createElement('div'); p.className = 'dslinks';
  for (const [label, url] of dsLinks(ds)) { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label; a.title = url; p.appendChild(a); }
  return p;
}

// the references to show on the board: B's for a change (the newer design), the part's own for a part
function boardRefs(e) {
  // 'A:<ref>' is a part of A only whose reference names another part in B: not on the board
  const onBoard = r => r && !r.startsWith('A:');
  if (e.kind === 'part') return (S.items[e.items[0]].refs || []).filter(onBoard).slice(0, 1);
  const out = [];
  for (const i of e.items) for (const m of S.items[i].b || []) if (onBoard(m.ref) && !out.includes(m.ref)) out.push(m.ref);
  return out;
}
const boardLoaded = () => !!(Review.info() && Review.info().board);

function renderDetail() {
  const box = $('detBody');
  foot.show();
  if (sel === null || !E[sel]) {
    box.dataset.key = '';
    box.innerHTML = '<div class="empty">' + (S ? '項目か図の部品を選ぶと、内容・意図・コメントをここに表示（どの部品にも質問できる）' : '「比較対象」で回路図を選ぶ') + '</div>';
    return;
  }
  const e = E[sel], r = rv(e.key);
  const keepTop = box.dataset.key === e.key ? box.scrollTop : 0;   // a refresh of the same entry keeps its place
  box.dataset.key = e.key;
  box.innerHTML = '';
  const t = document.createElement('div'); t.className = 't k-' + e.kind; t.textContent = e.title; box.appendChild(t);
  const side = !e.group && S.items[e.items[0]].side;     // a part of one side (two designs)
  if (side) {
    t.textContent = ' ' + e.title.replace(/^[AB] /, '');
    const tag = document.createElement('span'); tag.className = 'tag ' + side; tag.textContent = side.toUpperCase(); t.prepend(tag);
  }
  const k = document.createElement('div'); k.className = 'key'; k.textContent = e.key + (KIND_LABEL[e.kind] ? '・' + KIND_LABEL[e.kind] : ''); box.appendChild(k);
  const refs = boardLoaded() ? boardRefs(e) : [];
  if (refs.length) {
    const x = document.createElement('div'); x.className = 'row xlinks';
    x.innerHTML = refs.map(ref => '<a href="/board#ref=' + encodeURIComponent(ref) + '" target="kireview-board" title="基板の図でこの部品を表示">基板で見る ' + esc(ref) + '</a>').join('');
    box.appendChild(x);
  }
  if (e.group) {
    const h = document.createElement('h4'); h.textContent = '対象 ' + (e.items.length + e.folded.length) + ' 件（押すと拡大）'; box.appendChild(h);
    const list = document.createElement('div'); list.className = 'members';
    for (const i of e.items) {
      const it = S.items[i], b = document.createElement('button');
      b.className = 'member k-' + it.kind;
      b.textContent = it.title;
      const sm = document.createElement('small'); sm.textContent = it.detail; b.appendChild(sm);
      b.dataset.i = i;
      b.onclick = () => zoomToItems([i]);
      b.onmouseenter = () => { hoverItem = i; drawArrows(); };
      b.onmouseleave = () => { hoverItem = null; drawArrows(); };
      list.appendChild(b);
      if (dsLinks(it.ds).length) list.appendChild(linkRow(it.ds));
    }
    for (const f of e.folded) {
      const b = document.createElement('button');
      b.className = 'member folded';
      b.textContent = f.key + '（ラベル変更に統合）';
      const sm = document.createElement('small'); sm.textContent = '→ ' + S.items[f.into].title; b.appendChild(sm);
      b.onclick = () => select(itemEntry[f.into], true);
      list.appendChild(b);
    }
    box.appendChild(list);
  } else {
    const it = S.items[e.items[0]];
    if (it.detail) { const pre = document.createElement('pre'); pre.textContent = it.detail; box.appendChild(pre); }
    if (dsLinks(it.ds).length) box.appendChild(linkRow(it.ds));
    if (it.members && it.members.length) {
      const h = document.createElement('h4'); h.textContent = 'つながる部品 ' + it.members.length + ' 件（押すと拡大）'; box.appendChild(h);
      const list = document.createElement('div'); list.className = 'members';
      for (const m of it.members) {
        const b = document.createElement('button');
        b.className = 'member k-pin_moved';
        b.textContent = m.title;
        b.onclick = () => zoomToMarks(m.b.concat(m.a));
        list.appendChild(b);
      }
      box.appendChild(list);
    }
    // notes written on the pin items before they were folded into this label change
    for (const fk of it.folds || []) {
      const old = R.items[fk];
      if (!old || (!old.rationale && !(old.thread || []).length && !old.status)) continue;
      const d = document.createElement('div'); d.className = 'folded-note';
      d.innerHTML = '<b></b>';
      d.firstChild.textContent = '統合前の記録 ' + fk + (old.status ? '（' + (ST_NAME[old.status] || old.status) + '）' : '');
      if (old.rationale) { const w = document.createElement('div'); w.className = 'why'; w.textContent = old.rationale; d.appendChild(w); }
      d.insertAdjacentHTML('beforeend', Review.msgsHtml(old.thread));
      box.appendChild(d);
    }
  }
  const why = e.group ? e.group.rationale || r.rationale || '' : r.rationale || '';
  box.insertAdjacentHTML('beforeend', Review.askHtml(r, '/figures/' + encodeURIComponent(S.review.slug) + '/') +
    Review.notesHtml(r, why) + Review.threadHtml(r.thread));
  Review.bindFigures(box);
  box.scrollTop = keepTop;
  seen();
}

// the selected entry's unread reply is on screen: tell the server
function seen() {
  if (!S || sel === null || !E[sel]) return;
  const key = E[sel].key, it = R.items[key];
  Review.markSeen(S.review.page, key, it, r => { if (R.items[key]) { R.items[key] = stripId(r); renderList(); renderDetail(); } });
}

const foot = Review.footer({
  page: () => S && S.review.page,
  current: () => S && sel !== null && E[sel] ? [E[sel].key, R.items[E[sel].key] || null] : null,
  title: key => EK[key] !== undefined ? E[EK[key]].title : undefined,   // kept by the server for the agent's wait output
  next: () => Review.neighbor(sel !== null && E[sel] ? E[sel].key : null, 1),
  update(key, r, next) {
    R.items[key] = stripId(r);
    if (next && EK[next] !== undefined) select(EK[next], true);
    else { renderNav(); renderList(); drawArrows(); renderDetail(); }
  },
});

// the talk state of the review (long poll): keep the selection on the same entry, or on the group that now holds it
function applyTalk(d) {
  if (!S || d.page !== S.review.page) return;
  const selKey = sel !== null && E[sel] ? E[sel].key : null;
  R = { items: d.items || {}, groups: d.groups || [] };
  buildEntries();
  if (selKey) {
    let n = EK[selKey] !== undefined ? EK[selKey] : -1;
    if (n < 0) { const i = S.items.findIndex(it => it.key === selKey); n = i >= 0 ? itemEntry[i] : -1; }
    sel = n >= 0 ? n : null;
  }
  renderNav();
  renderList();
  drawArrows();
  renderDetail();
}

// ---------------------------------------------------------------- panes
function addImg(parent, info, w, h, cls, query) {
  const img = document.createElement('img');
  img.src = info.url + '?v=' + S.loaded + (query || '');
  img.className = cls || '';
  img.draggable = false;
  img.style.width = info.box[2] / w * 100 + '%';   // each sheet at its own size inside the common stage
  img.style.height = info.box[3] / h * 100 + '%';
  parent.appendChild(img);
}

// layers: list of {side, ghost: bool, group: bool}
// sides: which side's markers this pane shows ('a', 'b', 'ab' = both, 'flip' = the side on show)
function makePane(label, sides, layers, missing) {
  const p = document.createElement('div');
  p.className = 'pane';
  p.dataset.sides = sides;
  const sh = sheetInfo(sheet), [w, h] = sheetDims(sh);
  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.innerHTML = label;
  p.appendChild(lbl);
  const st = document.createElement('div');
  st.className = 'stage';
  st.style.width = w * PX_PER_MM + 'px';
  st.style.height = h * PX_PER_MM + 'px';
  for (const L of layers) {
    const info = sh[L.side];
    let parent = st;
    if (L.group) { parent = document.createElement('div'); parent.className = 'layer'; parent.dataset.flip = L.side; st.appendChild(parent); }
    if (!info) continue;
    addImg(parent, info, w, h, L.ghost ? 'ghost' : '', L.ghost ? '&tone=red' : '');
  }
  if (missing) {
    const n = document.createElement('div');
    n.className = 'none';
    n.textContent = missing;
    p.appendChild(n);
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'marks');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.setAttribute('preserveAspectRatio', 'none');
  st.appendChild(svg);
  p.appendChild(st);
  const arrows = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  arrows.setAttribute('class', 'arrows');
  p.appendChild(arrows);
  attachPanZoom(p);
  return p;
}

function renderPanes() {
  const views = $('views');
  views.querySelectorAll('.pane').forEach(p => p.remove());
  const sh = sheetInfo(sheet);
  if (!sh) { $('legend').innerHTML = ''; $('flipbar').style.display = 'none'; return; }
  if (S.single) {
    views.prepend(makePane('<span class="tag a">A</span> ' + esc(S.sides.a.short), 'a', [{ side: 'a' }]));
  } else if (mode === 'side') {
    views.prepend(makePane('<span class="tag b">B</span>', 'b', [{ side: 'b' }], !sh.b && 'このシートは B にありません'));
    views.prepend(makePane('<span class="tag a">A</span>', 'a', [{ side: 'a' }], !sh.a && 'このシートは A にありません'));
  } else if (mode === 'overlay') {
    views.prepend(makePane('<span class="tag b">B</span> の下に <span class="tag a">A</span> を薄い赤で重ね', 'ab', [{ side: 'a', ghost: true }, { side: 'b' }]));
  } else {
    views.prepend(makePane('<span id="flipLbl"></span>', 'flip', [{ side: 'a', group: true }, { side: 'b', group: true }]));
  }
  $('flipbar').style.display = !S.single && mode === 'flip' ? 'flex' : 'none';
  const key = '<b style="color:' + css('--add') + '">→ 追加</b>　<b style="color:' + css('--rem') + '">→ 削除</b>　<b style="color:' + css('--chg') +
    '">→ 値・フィールド</b>　<b style="color:' + css('--pin') + '">→ 接続</b>　<b style="color:' + css('--lab') + '">→ ラベル</b>';
  const marks = '<b style="color:' + css('--ask') + '">→ 未確認</b>　<b style="color:' + ST_DRAW['このまま'] + '">→✓ OK</b>　<b style="color:' +
    ST_DRAW['修正を依頼'] + '">→⚑ 直して</b>　<b style="color:' + ST_DRAW['修正済み'] + '">→✔ 修正済み</b>　<b style="color:' +
    ST_DRAW['質問'] + '">→？ 質問</b>　<b style="color:' + css('--info') + '">┅ 選んだ部品</b>';
  const ask = '図の部品を押すと質問・コメント', shownKey = (S.show_diff ? key + '　' : '') + marks + '　' + ask;
  $('legend').innerHTML = S.single ? '一覧の項目を選ぶと矢印で表示'
    : mode === 'overlay' ? '<b style="color:#e8a0a0">薄い赤 = A</b>（その上に B）　' + shownKey : shownKey;
  applyFlip();
  drawMarks();
  applyView();
}

function applyFlip() {
  document.querySelectorAll('.layer[data-flip="b"]').forEach(l => l.style.display = flipSide === 'b' ? '' : 'none');
  document.querySelectorAll('#flipbar button').forEach(b => b.classList.toggle('on', b.dataset.flip === flipSide));
  const l = $('flipLbl');
  if (l) l.innerHTML = flipSide === 'b' ? '<span class="tag b">B</span> 表示中' : '<span class="tag a">A</span> 表示中';
  if (mode === 'flip') drawArrows();
}

function paneSides(p) {
  const s = p.dataset.sides;
  return s === 'flip' ? [flipSide] : s === 'ab' ? ['a', 'b'] : [s];
}

// markers of item i on side k: [{box (sheet mm), frame: bool}]
function targets(it, k) {
  if (it.mark === false) return [];
  if (ONLY_SIDE[it.kind] && ONLY_SIDE[it.kind] !== k) return [];
  const out = [];
  for (const m of it[k].filter(m => m.sheet === sheet)) {
    // only fields changed, same symbol: point at the visible changed field texts
    const f = it.kind === 'comp_changed' && !it.fields.includes('Symbol') ? it.fields.filter(n => m.fields && m.fields[n]) : [];
    if (f.length) for (const n of f) out.push({ box: m.fields[n], frame: true });
    else out.push({ box: m.box, frame: false });
  }
  return out;
}

function drawMarks() {               // sheet-mm layer: only the hierarchical sheet boxes (shown on hover)
  const NS = 'http://www.w3.org/2000/svg', sh = sheetInfo(sheet);
  document.querySelectorAll('.pane').forEach(p => {
    const svg = p.querySelector('svg.marks');
    svg.innerHTML = '';
    const subs = {};
    for (const k of ['a', 'b']) for (const c of (sh[k] && sh[k].children) || []) subs[c.path] = c.box;
    for (const [path, b] of Object.entries(subs)) {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', b[0] - 0.4); r.setAttribute('y', b[1] - 0.4);
      r.setAttribute('width', b[2] - b[0] + 0.8); r.setAttribute('height', b[3] - b[1] + 0.8);
      r.setAttribute('class', 'sub');
      r.dataset.path = path;
      svg.appendChild(r);
    }
  });
  drawArrows();
}

function itemRef(i) {           // short label for an arrow: the part reference
  const it = S.items[i];
  if (it.kind === 'label_changed') return it.label[1];
  return it.refs[0] || it.key.replace(/^\w+:/, '');
}

function markMembers(items) {    // detail panel: highlight the members under an arrow
  document.querySelectorAll('#detail .member').forEach(m => m.classList.toggle('hl', items.includes(+m.dataset.i)));
}

function drawArrows() {              // arrows + field frames in screen pixels, recomputed on every pan / zoom
  if (!S) return;
  const NS = 'http://www.w3.org/2000/svg';
  document.querySelectorAll('.pane').forEach(p => {
    const svg = p.querySelector('svg.arrows');
    if (!svg) return;
    svg.innerHTML = '';
    const W = p.clientWidth, H = p.clientHeight, list = [], frames = [];
    for (const k of paneSides(p)) {
      S.items.forEach((it, i) => {
        const n = itemEntry[i];
        if (n === undefined) return;
        if (S.single && n !== sel) return;                         // one design: only the selected item
        const mk = S.single ? 'ask' : markKind(E[n]);
        if (mk === 'info' && n !== sel) return;                    // a picked part: only while selected
        if (n !== sel && !matches(E[n])) return;                   // the list filter also filters the drawing
        for (const t of targets(it, k)) {
          const x0 = view.x + t.box[0] * view.s, y0 = view.y + t.box[1] * view.s;
          const x1 = view.x + t.box[2] * view.s, y1 = view.y + t.box[3] * view.s;
          if (x1 < -40 || y1 < -40 || x0 > W + 40 || y0 > H + 40) continue;
          if (mk === 'info') { frames.push({ x0, y0, x1, y1, n, i, color: css('--info'), info: true }); continue; }
          // reviewed: the status colour with its mark at the tail; not reviewed yet: groups and parts --ask (purple),
          // changes their kind colour
          const st = rv(E[n].key).status || '';
          // not reviewed yet: parts --ask, changes (also inside a group) their kind colour
          const color = ST_DRAW[st] || css(it.kind === 'part' ? '--ask' : (KIND_COLOR[it.kind] || '--chg'));
          if (t.frame) frames.push({ x0, y0, x1, y1, n, i, color });
          // tip just outside the top-left corner of the target, tail further up-left (never on the target itself)
          list.push({ x: x0 - 2, y: y0 - 2, entries: [n], items: [i], color, prio: STATUS_PRIO[st] || 3, mark: ST_ARROW[st] || '' });
        }
      });
    }
    const merged = [];
    for (const m of list) {
      const o = merged.find(o => Math.hypot(o.x - m.x, o.y - m.y) < MERGE_PX);
      if (o) {
        for (const n of m.entries) if (!o.entries.includes(n)) o.entries.push(n);
        for (const i of m.items) if (!o.items.includes(i)) o.items.push(i);
        if (m.entries.includes(sel) || m.prio > o.prio) { o.color = m.color; o.prio = m.prio; o.mark = m.mark; }   // selected / most urgent wins
      } else merged.push(m);
    }
    // selection: its arrows / frames stand out, all others fade
    const state = (entries, items) => {
      if (hoverItem !== null && items.includes(hoverItem)) return 'sel hover';
      if (sel === null) return '';
      return entries.includes(sel) ? 'sel' : 'dim';
    };
    const pick = (g, entries, items) => {
      g.addEventListener('pointerdown', ev => {
        ev.stopPropagation();
        ev.preventDefault();
        const id = entries.join(',');
        const c = entries.includes(sel) && entries.length === 1 ? 0 : (markerCycle[id] || 0);   // merged arrow: next entry per click
        markerCycle[id] = (c + 1) % entries.length;
        select(entries[c], false);
      });
      g.addEventListener('mouseenter', () => markMembers(items));
      g.addEventListener('mouseleave', () => markMembers([]));
    };
    const layers = { dim: [], plain: [], sel: [] };    // selected drawn last (on top)
    const placed = [];                                // label boxes already used: move a new label up until it is free
    const labelY = (x, y, w) => {
      for (let n = 0; n < 8 && placed.some(b => x - w < b[2] && x > b[0] && y - 12 < b[3] && y > b[1]); n++) y -= 13;
      placed.push([x - w, y - 12, x, y]);
      return y;
    };
    for (const f of frames) {
      const g = document.createElementNS(NS, 'g'), st = state([f.n], [f.i]);
      if (st) g.setAttribute('class', st);
      const x = f.x0 - 1.5, y = f.y0 - 1.5, w = f.x1 - f.x0 + 3, h = f.y1 - f.y0 + 3;
      g.innerHTML = (st.startsWith('sel') ? '<rect class="glow" x="' + (x - 2) + '" y="' + (y - 2) + '" width="' + (w + 4) + '" height="' + (h + 4) + '" rx="3" stroke-width="5" stroke="' + f.color + '"/>' : '') +
        '<rect class="frame' + (f.info ? ' info' : '') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2" stroke="' + f.color + '"/>';
      pick(g, [f.n], [f.i]);
      layers[st.startsWith('sel') ? 'sel' : st || 'plain'].push(g);
    }
    for (const m of merged) {
      const g = document.createElementNS(NS, 'g'), st = state(m.entries, m.items);
      if (st) g.setAttribute('class', st);
      const tx = m.x - ARROW_PX * 0.72, ty = m.y - ARROW_PX * 0.72;
      const head = 'M' + m.x + ' ' + m.y + ' l-8 -1.6 l6.4 -6.4 z';
      const shaft = 'M' + tx + ' ' + ty + ' L' + (m.x - 4) + ' ' + (m.y - 4);
      // label at the tail: the references this arrow stands for (selected members only, when selected)
      const mine = st.startsWith('sel') ? m.items.filter(i => itemEntry[i] === sel || i === hoverItem) : [];
      let label = mine.length ? [...new Set(mine.map(itemRef))].join(' ') : (m.entries.length > 1 ? String(m.entries.length) : '');
      if (m.mark) label = m.mark + (label ? ' ' + label : '');
      g.innerHTML =
        '<path class="hit" d="M' + tx + ' ' + ty + ' L' + m.x + ' ' + m.y + '"/>' +
        (st.startsWith('sel') ? '<path class="glow" stroke-width="10" stroke="' + m.color + '" d="' + shaft + '"/>' : '') +
        '<path class="halo" d="' + shaft + '"/>' +
        '<path class="shaft" stroke="' + m.color + '" d="' + shaft + '"/>' +
        '<path d="' + head + '" fill="' + m.color + '" stroke="#fff" stroke-width="0.8"/>' +
        (label ? '<text class="' + (mine.length ? 'ref' : '') + '" x="' + (tx - 3) + '" y="' + labelY(tx - 3, ty - 3, label.length * 7.5) +
          '" text-anchor="end" fill="' + m.color + '">' + esc(label) + '</text>' : '');
      const title = document.createElementNS(NS, 'title');
      title.textContent = m.entries.map(n => E[n].title).join('\n');
      g.appendChild(title);
      pick(g, m.entries, m.items);
      layers[st.startsWith('sel') ? 'sel' : st || 'plain'].push(g);
    }
    for (const g of layers.dim.concat(layers.plain, layers.sel)) svg.appendChild(g);
  });
}

function clearSelection() {
  if (sel === null) return;
  sel = null;
  hoverItem = null;
  renderList();
  drawArrows();
  renderDetail();
}

function applyView() {
  const t = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s / PX_PER_MM + ')';
  document.querySelectorAll('.stage').forEach(st => st.style.transform = t);
  drawArrows();
}

function paneSize() {
  const p = document.querySelector('.pane');
  return p ? [p.clientWidth, p.clientHeight] : [800, 600];
}

function fit() {
  if (!S) return;
  const sh = sheetInfo(sheet);
  if (!sh) return;
  const [w, h] = sheetDims(sh), [pw, ph] = paneSize();
  view.s = Math.min(pw / w, ph / h) * 0.98;
  view.x = (pw - w * view.s) / 2;
  view.y = (ph - h * view.s) / 2;
  applyView();
}

function zoomTo(box) {
  const [pw, ph] = paneSize();
  const bw = Math.max(box[2] - box[0], 30), bh = Math.max(box[3] - box[1], 22);
  view.s = Math.min(pw / (bw * 2.2), ph / (bh * 2.2));
  const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
  view.x = pw / 2 - cx * view.s;
  view.y = ph / 2 - cy * view.s;
  applyView();
}

// move to the sheet of the given items (the current one when it has them) and zoom to them
function zoomToItems(items) {
  if (items.length) zoomToMarks([].concat(...items.map(i => S.items[i].b.concat(S.items[i].a))), S.items[items[0]].sheet);
}

function zoomToMarks(marks, fallbackSheet) {
  const target = marks.find(m => m.sheet === sheet) || marks[0];
  const sh = target ? target.sheet : fallbackSheet || sheet;
  if (sh !== sheet && sheetInfo(sh)) setSheet(sh, false);
  const here = marks.filter(m => m.sheet === sheet);
  if (here.length) {
    zoomTo([Math.min(...here.map(m => m.box[0])), Math.min(...here.map(m => m.box[1])),
            Math.max(...here.map(m => m.box[2])), Math.max(...here.map(m => m.box[3]))]);
  } else fit();
}

function sheetPoint(p, e) {     // pointer position in sheet mm
  const r = p.getBoundingClientRect();
  return [(e.clientX - r.left - view.x) / view.s, (e.clientY - r.top - view.y) / view.s];
}

function subAt(p, e) {          // hierarchical sheet under the pointer
  const [x, y] = sheetPoint(p, e);
  const sh = sheetInfo(sheet);
  for (const k of ['b', 'a']) for (const c of (sh[k] && sh[k].children) || []) {
    if (x >= c.box[0] && x <= c.box[2] && y >= c.box[1] && y <= c.box[3] && sheetInfo(c.path)) return c.path;
  }
  return null;
}

function partAt(p, e) {         // smallest part box under the pointer on the pane's side(s): {k, ref}
  const [x, y] = sheetPoint(p, e);
  const pad = 4 / view.s;          // a few screen pixels of slack: small parts are hard to hit when zoomed out
  for (const k of p.dataset.sides === 'ab' ? ['b', 'a'] : paneSides(p)) {
    let best = null, area = Infinity;
    for (const q of S.parts[k] || []) {
      const b = q.box;
      if (q.sheet !== sheet || x < b[0] - pad || x > b[2] + pad || y < b[1] - pad || y > b[3] + pad) continue;
      const s = (b[2] - b[0]) * (b[3] - b[1]);
      if (s < area) { area = s; best = q; }
    }
    if (best) return { k, ref: best.ref };
  }
  return null;
}

// entry for a part clicked in the drawing: a change (or group) marking it on that side and sheet, else the part itself
function partEntry(k, ref) {
  const n = E.findIndex(e => e.kind !== 'part' && e.items.some(i => {
    const it = S.items[i];
    return it.mark !== false && it[k].some(m => m.ref === ref && m.sheet === sheet);
  }));
  if (n >= 0) return n;
  return keyEntry(S.single ? 'comp:' + ref : 'part:' + k + ':' + ref);
}

function attachPanZoom(p) {
  p.addEventListener('wheel', e => {
    e.preventDefault();
    const r = p.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = Math.exp(-e.deltaY * 0.0015);
    const ns = Math.min(200, Math.max(0.2, view.s * f)), k = ns / view.s;
    view.x = mx - (mx - view.x) * k;
    view.y = my - (my - view.y) * k;
    view.s = ns;
    applyView();
  }, { passive: false });
  let drag = null;
  p.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (e.ctrlKey) { const hit = subAt(p, e); if (hit) { setSheet(hit, true); return; } }
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    p.setPointerCapture(e.pointerId);
    p.classList.add('drag');
  });
  p.addEventListener('pointerup', e => {     // a click (no drag): selects the part there, on empty space clears the selection
    if (!drag || Math.hypot(e.clientX - drag.x, e.clientY - drag.y) >= 4 || e.ctrlKey) return;
    const hit = partAt(p, e), n = hit ? partEntry(hit.k, hit.ref) : -1;
    if (n >= 0) select(n, false);
    else clearSelection();
  });
  p.addEventListener('pointermove', e => {
    if (drag) {
      view.x = drag.vx + e.clientX - drag.x;
      view.y = drag.vy + e.clientY - drag.y;
      applyView();
      return;
    }
    const hit = subAt(p, e), part = partAt(p, e);
    p.classList.toggle('hot', !!hit || !!part);
    p.title = part ? part.ref : '';
    document.querySelectorAll('svg.marks rect.sub').forEach(r => r.classList.toggle('hot', r.dataset.path === hit));
  });
  const end = () => { drag = null; p.classList.remove('drag'); };
  p.addEventListener('pointerup', end);
  p.addEventListener('pointercancel', end);
  p.addEventListener('dblclick', e => { const hit = subAt(p, e); if (hit) setSheet(hit, true); });
}

function setSheet(name, refit) {
  sheet = name;
  renderNav();
  renderPanes();
  renderList();
  if (refit) fit();
}

// zoom: true when chosen from the list (move the drawing); false when chosen by its arrow (the view stays)
function select(n, zoom) {
  if (n === undefined || n < 0 || !E[n]) return;
  sel = n;
  if (zoom) zoomToItems(E[n].items.length ? E[n].items : (E[n].folded || []).map(f => f.into));
  if (filterText && !matches(E[n])) { filterText = ''; $('filter').value = ''; }
  renderNav();
  renderList();
  drawArrows();
  renderDetail();
  const el = document.querySelector('#list .item.sel');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

// #ref=<REF>: the entry for that part (two designs: a change marking it on B, else B's part, else A's part; one design:
// the part) and zoom to it
function gotoRef(ref) {
  let n = -1;
  if (S && S.single) n = keyEntry('comp:' + ref);
  else if (S) {
    n = E.findIndex(e => e.kind !== 'part' && e.items.some(i => { const it = S.items[i]; return it.mark !== false && (it.b || []).some(m => m.ref === ref); }));
    if (n < 0) n = keyEntry('part:b:' + ref);
    if (n < 0) n = keyEntry('part:a:' + ref);
  }
  if (n < 0) { notice($('tabs'), ref + ' は回路図にありません'); return; }
  select(n, true);
}
function takeRef() { const r = Review.takeRef(); if (r) gotoRef(r); }

function load(state) {
  if (state.empty) {
    S = null;
    sel = null;
    buildEntries();
    renderHeader(); renderNav(); renderList(); renderPanes(); renderDetail();
    openCompare();
    return;
  }
  const same = S && S.review.page === state.review.page;
  S = state;
  if (!same) R = { items: {}, groups: [] };   // another review: its notes come with the next talk state
  if (!sheetInfo(sheet)) sheet = S.sheets[0] ? S.sheets[0].name : '/';
  sel = null;
  buildEntries();
  renderHeader();
  if (!S.single) fillPair();
  renderNav();
  renderList();
  renderPanes();
  renderDetail();
  fit();
  if (!conn) conn = Review.connect(S.review.page, applyTalk);
  else conn.setPage(S.review.page);
}

// ---------------------------------------------------------------- controls
function goUp() { if (sheet !== '/') setSheet(sheetInfo(parentOf(sheet)) ? parentOf(sheet) : '/', true); }
function flip() { flipSide = flipSide === 'b' ? 'a' : 'b'; applyFlip(); }
$('stabs').addEventListener('wheel', e => {            // a vertical wheel scrolls the tab row sideways
  if (!e.deltaY || e.shiftKey) return;
  e.preventDefault();
  $('stabs').scrollLeft += e.deltaY;
}, { passive: false });
// 対応: a popover with the A ⇔ B sheet selects
function openPair() {
  const r = $('pairBtn').getBoundingClientRect(), pop = $('pairPop');
  pop.hidden = false;
  pop.style.top = r.bottom + 6 + 'px';
  pop.style.left = Math.max(8, Math.min(r.right - pop.offsetWidth, innerWidth - pop.offsetWidth - 8)) + 'px';
}
$('pairBtn').onclick = () => { if ($('pairPop').hidden) openPair(); else $('pairPop').hidden = true; };
document.addEventListener('pointerdown', e => {
  if (!$('pairPop').hidden && !e.target.closest('#pairPop') && !e.target.closest('#pairBtn')) $('pairPop').hidden = true;
});
$('modes').onclick = e => {
  const m = e.target.dataset.mode;
  if (!m || !S) return;
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  renderPanes();
};
$('fit').onclick = fit;
$('diffChk').onchange = async e => {
  const box = e.currentTarget;
  if (!S || S.single) return;
  try { load(await api('/api/sch/show-diff', { on: box.checked })); notice(box.parentElement, S.show_diff ? '差分を表示' : '並べるだけ（図の部品を押すと質問）'); }
  catch (err) { box.checked = !box.checked; notice(box.parentElement, '失敗: ' + err.message); }
};
// sheet pairing: A select = pair that A sheet with the B sheet on show, B select = the other way; （なし） = no pair
async function pairSheets(el, a, b) {
  try {
    load(await api('/api/sch/sheet-pair', { a, b }));
    const t = S.sheets.find(s => s.apath === a && (!b || s.bpath === b));
    if (t) setSheet(t.name, true);
    notice(el, b ? '対応: ' + a + ' ⇔ ' + b : '対応なし: ' + a);
  } catch (err) { renderNav(); notice(el, '失敗: ' + err.message); }
}
$('pairA').onchange = e => { const sh = sheetInfo(sheet), a = e.target.value; pairSheets(e.target, a || sh.apath, a ? sh.bpath : ''); };
$('pairB').onchange = e => pairSheets(e.target, sheetInfo(sheet).apath, e.target.value);
$('filter').oninput = e => { filterText = e.target.value.trim().toLowerCase(); renderList(); drawArrows(); };
document.querySelectorAll('#flipbar [data-flip]').forEach(b => b.onclick = () => { flipSide = b.dataset.flip; applyFlip(); });
$('list').addEventListener('click', e => {
  if (e.target.closest('a')) return;                 // a datasheet link
  const h = e.target.closest('.grp-h');
  if (h) { if (sheetInfo(h.dataset.sheet)) setSheet(h.dataset.sheet, true); return; }
  const row = e.target.closest('.item');
  if (row && EK[row.dataset.id] !== undefined) select(EK[row.dataset.id], true);
});
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || !S) return;
  if (e.code === 'Space' && mode === 'flip' && !S.single) { e.preventDefault(); flip(); }
  else if (e.key === 'Backspace' || (e.altKey && e.key === 'ArrowLeft')) { e.preventDefault(); goUp(); }
});
$('reload').onclick = async e => {
  const btn = e.currentTarget;
  if (!S) return;
  status('書き出し中…');
  try { load(await api('/api/sch/reload', {})); status(''); notice(btn, '再読み込み完了（' + E.length + ' 件）'); }
  catch (err) { status(''); notice(btn, '失敗: ' + err.message); }
};
document.querySelectorAll('[data-open]').forEach(b => b.onclick = async () => {
  const k = b.dataset.open;
  try {
    const r = await api('/api/sch/open', { side: k });
    notice(b, k.toUpperCase() + ' を KiCad で表示' + (r.readonly ? '（読み取り専用コピー）' : ''));
  } catch (err) { notice(b, '失敗: ' + err.message); }
});

// compare target panel
const RECENT_MAX = 10;
const cmp = { a: {}, b: {} };   // side -> {path, ref, repo, rel}
const enc = encodeURIComponent;
function parentDir(p) { const q = p.replace(/[\\/]+$/, ''); const i = q.search(/[\\/][^\\/]*$/); return i > 0 ? q.slice(0, i) : q; }
function sideEl(k, cls) { return document.querySelector('.cmp-side[data-side="' + k + '"] .' + cls); }
function option(parent, value, text) { const o = document.createElement('option'); o.value = value; o.textContent = text; parent.appendChild(o); return o; }

async function fillProjects(k, dirHint) {
  const box = sideEl(k, 'proj'), dir = parentDir(cmp[k].path || dirHint || '');
  box.innerHTML = '';
  option(box, '', 'プロジェクト一覧（' + dir + '）').disabled = true;
  box.value = '';
  if (!dir) return;
  try {
    const r = await api('/api/projects?dir=' + enc(dir));
    for (const pr of r.projects) option(box, pr.path, pr.name);
    const cur = (cmp[k].path || '').replace(/\\/g, '/').replace(/\/$/, '');
    if (r.projects.some(pr => pr.path === cur)) box.value = cur;
  } catch (err) { option(box, '', '一覧の取得失敗: ' + err.message).disabled = true; }
}

async function fillRefs(k) {
  const box = sideEl(k, 'ref'), cur = cmp[k].ref || '';
  box.innerHTML = '';
  box.disabled = true;
  option(box, '', '最新（今のフォルダ）');
  cmp[k].repo = null;
  if (!cmp[k].path) return;
  try {
    const r = await api('/api/refs?path=' + enc(cmp[k].path));
    if (!r.repo) { box.firstChild.textContent = '最新（今のフォルダ。git 管理外）'; return; }
    if (r.state && r.state.text) box.firstChild.textContent = r.state.text;
    cmp[k].repo = r.repo;
    cmp[k].rel = r.rel;
    box.disabled = false;
    if (r.tags.length) {
      const g = document.createElement('optgroup'); g.label = 'タグ'; box.appendChild(g);
      for (const t of r.tags) option(g, t.name, t.date + ' 時点  ' + t.name);
    }
    if (r.commits.length) {
      const g = document.createElement('optgroup'); g.label = 'コミット（このフォルダ）'; box.appendChild(g);
      for (const c of r.commits) option(g, c.sha, c.date + ' 時点  ' + c.sha + '  ' + c.subject.slice(0, 60));
    }
    if (cur && ![...box.options].some(o => o.value === cur)) option(box, cur, cur);
    box.value = cur;
  } catch (err) { box.firstChild.textContent = '最新（今のフォルダ。版の取得失敗）'; }
}

function renderSide(k) {
  sideEl(k, 'path').value = cmp[k].path || '';
  fillProjects(k, cmp.a.path || cmp.b.path);
  fillRefs(k);
}

function specOf(k) {
  const c = cmp[k];
  if (!c.ref || !c.repo) return (c.path || '').trim();
  return c.repo + '@' + c.ref + ':' + (c.rel === '.' ? '' : c.rel);
}

function loadRecent() { try { return JSON.parse(store.get('kidiff.recent') || '[]'); } catch (_) { return []; } }
function saveRecent(entry) {
  const list = [entry].concat(loadRecent().filter(r => r.a !== entry.a || r.b !== entry.b)).slice(0, RECENT_MAX);
  store.set('kidiff.recent', JSON.stringify(list));
}
function renderRecent() {
  const box = $('recent'), list = loadRecent();
  box.innerHTML = '';
  if (!list.length) { box.textContent = 'なし'; return; }
  for (const r of list) {
    const b = document.createElement('button');
    b.textContent = r.b ? 'A ' + r.la + '  →  B ' + r.lb : r.la + '（1 設計）';
    b.title = 'A: ' + r.a + (r.b ? '\nB: ' + r.b : '');
    b.onclick = () => runCompare(b, r.a, r.b);
    box.appendChild(b);
  }
}

async function runCompare(btn, a, b) {
  btn.disabled = true;
  status('書き出し中…');
  try {
    const st = await api('/api/sch/compare', { a, b });
    load(st);
    status('');
    saveRecent({ a, b, la: st.sides.a.short, lb: st.sides.b ? st.sides.b.short : '' });
    $('cmp').hidden = true;
    notice($('cmpBtn'), (st.single ? '読み込み完了（部品 ' : '比較完了（項目 ') + E.length + ' 件）');
  } catch (err) {
    status('');
    notice(btn, '失敗: ' + err.message);
  } finally { btn.disabled = false; }
}

function openCompare() {
  const r = $('cmpBtn').getBoundingClientRect();
  const panel = $('cmp');
  panel.style.top = r.bottom + 6 + 'px';
  panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 576)) + 'px';
  for (const k of ['a', 'b']) {
    const s = S && S.sides[k];
    cmp[k] = s ? { path: s.folder, ref: s.kind === 'git' ? s.ref : '' } : { path: '', ref: '' };
    renderSide(k);
  }
  renderRecent();
  panel.hidden = false;
}
$('cmpBtn').onclick = () => { if ($('cmp').hidden) openCompare(); else $('cmp').hidden = true; };
$('cmpClose').onclick = () => { $('cmp').hidden = true; };
$('cmpSwap').onclick = () => { [cmp.a, cmp.b] = [cmp.b, cmp.a]; renderSide('a'); renderSide('b'); };
$('cmpClearB').onclick = () => { cmp.b = { path: '', ref: '' }; renderSide('b'); };
$('cmpRun').onclick = e => {
  const a = specOf('a'), b = specOf('b');
  if (!a) { notice(e.currentTarget, 'A のパスを指定'); return; }
  runCompare(e.currentTarget, a, b);
};
for (const k of ['a', 'b']) {
  sideEl(k, 'proj').onchange = e => { cmp[k] = { path: e.target.value, ref: '' }; sideEl(k, 'path').value = e.target.value; fillRefs(k); };
  sideEl(k, 'path').onchange = e => { cmp[k] = { path: e.target.value.trim(), ref: '' }; fillProjects(k, cmp.a.path || cmp.b.path); fillRefs(k); };
  sideEl(k, 'ref').onchange = e => { cmp[k].ref = e.target.value; };
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('cmp').hidden) { $('cmp').hidden = true; return; }
  if (!$('pairPop').hidden) { $('pairPop').hidden = true; return; }
  if (!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) clearSelection();
});

// ---------------------------------------------------------------- start
Review.init('sch');
Review.docks('kireview.sch', fit);
Review.arrowKeys(() => !$('cmp').hidden || !$('pairPop').hidden, d => {
  const key = Review.neighbor(sel !== null && E[sel] ? E[sel].key : null, d);
  if (key != null && EK[key] !== undefined) select(EK[key], true);
});
let boardOn = null;
Review.onInfo(i => { if (!!i.board !== boardOn) { boardOn = !!i.board; renderDetail(); } });   // the links to the board
document.addEventListener('visibilitychange', seen);
addEventListener('hashchange', takeRef);
window.addEventListener('resize', fit);
api('/api/sch/state').then(st => { load(st); takeRef(); }).catch(err => status('読み込み失敗: ' + err.message));
</script>
