<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Datasheet · kicad-review</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<style>
:root { --line: #d0d4da; --text: #222; --muted: #687078; --bar: #f3f4f6; --accent: #2b6fd6; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #fff; }
#bar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line); background: var(--bar); white-space: nowrap; }
#url { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#direct { color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; background: #fff; }
#direct:hover { border-color: var(--accent); }
#main { flex: 1; position: relative; }
#doc { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#msg { position: absolute; left: 0; right: 0; top: 0; padding: 24px; color: var(--muted); }
#msg[hidden] { display: none; }
#msg a { display: inline-block; margin-top: 10px; color: var(--accent); word-break: break-all; font-size: 14px; }
</style>
</head>
<body>
<div id="bar"><span id="url"></span><a id="direct" target="_blank" rel="noopener noreferrer"></a></div>
<div id="main"><iframe id="doc" title="datasheet"></iframe><div id="msg" hidden></div></div>
<script src="/i18n.js"></script>
<script>
// The datasheet tab (review.js openDatasheet): one tab of kicad-review that the review pages open every datasheet in,
// shown in a frame under a bar with the link itself. The tab is named after the review it was opened from and the part
// ("<review> datasheet (U9)"). It stays a page of ours, so the review pages find it again by its name, and its link
// back to the review page is cut here (a datasheet site could use it to move the review page elsewhere). Only web pages
// (http, https) and the
// datasheet files the server serves (/api/datasheet/...) are shown. A web link goes through /api/datasheet-url: the
// server gets the PDF and shows it from here, as many makers' sites refuse to be shown in a frame (and the browser
// tells the page nothing when a site refuses, so it is not tried); when it gets none (a web page, or a site that does
// not answer a server), the tab shows the link to open.
'use strict';
try { window.opener = null; } catch (_) {}
const q = new URLSearchParams(location.search), u = q.get('u') || '', ref = q.get('r') || '', name = q.get('n') || '';
let to = null;
try { to = new URL(u, location.href); } catch (_) {}
const ok = to && ((to.protocol === 'http:' || to.protocol === 'https:') && to.origin !== location.origin ||
                  to.origin === location.origin && to.pathname.startsWith('/api/datasheet/'));
document.title = t(name ? 'ds.title.name' : 'ds.title', { name }) + (ref ? t('paren', { x: ref }) : '');
const doc = document.getElementById('doc'), msg = document.getElementById('msg');
if (ok) {
  document.getElementById('url').textContent = to.href;
  document.getElementById('url').title = to.href;
  const a = document.getElementById('direct');
  a.href = to.href;
  a.textContent = t('ds.direct');
  a.title = t('ds.direct.title');
  msg.textContent = t('ds.loading');
  msg.hidden = false;
  doc.addEventListener('load', () => { msg.hidden = true; });
  const pdf = '/api/datasheet-url?u=' + encodeURIComponent(u.trim());
  if (to.origin === location.origin) doc.src = to.href;
  else fetch(pdf + '&probe=1').then(r => r.ok ? r.json() : {}).catch(() => ({})).then(d => {
    if (d.pdf) { doc.src = pdf; return; }
    doc.remove();                      // no PDF from here: the link itself, to open in a tab of its own
    msg.textContent = t('ds.nopdf', { host: to.host });
    const link = document.createElement('a');
    link.href = to.href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = to.href;
    msg.append(document.createElement('br'), link);
  });
} else {
  doc.remove();
  document.getElementById('direct').remove();
  msg.textContent = t('ds.bad', { u });
  msg.hidden = false;
}
</script>
</body>
</html>
