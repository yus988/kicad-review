[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-review"
dynamic = ["version"]
description = "Review KiCad schematics (two versions or one design) and boards with a coding agent, on a local web page"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuke Yamazaki" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["kicad", "schematic", "pcb", "diff", "review", "eda", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/yus988/kicad-review"
Issues = "https://github.com/yus988/kicad-review/issues"

[project.scripts]
kicad-review = "kicad_review.kireview:main"
talkpage = "talkpage:main"

[tool.setuptools.dynamic]
version = { attr = "kicad_review.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad_review = ["*.html", "*.js", "*.css"]
talkpage = ["*.js", "*.css"]
