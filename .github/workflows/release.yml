# Publish to PyPI when a version tag (v0.1.0, ...) is pushed. PyPI side: add this repository and workflow as a
# Trusted Publisher of the project "kicad-review" (no token is stored here).
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: the tag matches the package version
        run: test "v$(python -c 'import sys; sys.path.insert(0, "src"); import kicad_review; print(kicad_review.__version__)')" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
